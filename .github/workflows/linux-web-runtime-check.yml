name: Linux Web Runtime Check

on:
  push:
    branches:
      - linux-web-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-runtime:
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 20

    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          uname -a
          node --version
          npm --version

      - name: Robust sparse checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local http.version HTTP/1.1
          git config --local http.lowSpeedLimit 1024
          git config --local http.lowSpeedTime 15
          git sparse-checkout init --cone
          git sparse-checkout set .github webapp docs

          fetched=0
          for attempt in 1 2 3 4 5; do
            echo "fetch attempt ${attempt}/5"
            if timeout 120s git -c protocol.version=2 fetch \
              --filter=blob:none \
              --no-tags \
              --prune \
              --no-recurse-submodules \
              --depth=1 \
              origin "+${GITHUB_SHA}:refs/remotes/origin/linux-web-runtime"; then
              fetched=1
              break
            fi
            sleep $((attempt * 3))
          done

          test "$fetched" -eq 1
          git checkout --force --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Runtime tests
        working-directory: webapp
        run: npm test

      - name: TypeScript typecheck
        working-directory: webapp
        run: npm run typecheck

      - name: Frontend build
        working-directory: webapp
        run: npm run build

# Workflow intentionally lives on the feature branch so every implementation push is verified on RK3588.
