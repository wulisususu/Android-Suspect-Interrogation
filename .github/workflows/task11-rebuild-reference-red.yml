name: Task 11 Rebuild Reference RED

on:
  push:
    branches:
      - feat/dual-speaker-backends
    paths:
      - tests/release/test_rebuild_speaker_reference.py
      - .github/workflows/task11-rebuild-reference-red.yml
  workflow_dispatch:

jobs:
  task11-red:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: linux/backend
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: "1"
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r linux/backend/requirements.txt pytest
      - name: Task 11 rebuild reference contract
        run: python -m pytest -q tests/release/test_rebuild_speaker_reference.py
