name: RK3588 Qwen Routing Latency Confirmation

on:
  workflow_dispatch:
  push:
    branches:
      - perf/qwen-routing-latency-experiment
    paths:
      - '.github/workflows/rk3588-qwen-routing-latency-confirm.yml'
      - 'scripts/ci/probe-llamapi-qwen-routing.py'
      - 'linux/backend/tests/test_probe_qwen_compact_protocol.py'
      - 'linux/backend/tests/test_probe_llamapi_qwen_routing.py'

permissions:
  contents: read

concurrency:
  group: rk3588-qwen-routing-latency-confirm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-gate:
    name: Hosted confirmation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: linux/backend
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: '1'
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r linux/backend/requirements.txt pytest httpx
      - name: Verify probe contracts
        run: |
          python -m py_compile scripts/ci/probe-llamapi-qwen-routing.py
          python -m pytest \
            linux/backend/tests/test_probe_llamapi_qwen_routing.py \
            linux/backend/tests/test_probe_qwen_compact_protocol.py -q
      - name: Stage verified probe
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/qwen-latency-confirm-bundle"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE"
          cp scripts/ci/probe-llamapi-qwen-routing.py "$BUNDLE/"
          printf '%s\n' "$GITHUB_SHA" > "$BUNDLE/source-sha.txt"
          (cd "$BUNDLE" && sha256sum probe-llamapi-qwen-routing.py > bundle.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-latency-confirm-probe-bundle
          path: ${{ runner.temp }}/qwen-latency-confirm-bundle/
          if-no-files-found: error
          retention-days: 3

  rk3588-confirm:
    name: RK3588 ABBA latency confirmation
    needs: hosted-gate
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 20
    env:
      LLAMAPI_BASE_URL: 'http://127.0.0.1:9265/v1'
      LLAMAPI_MODEL_HINT: 'qwen3:4b'
    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          hostname
          uname -a
          test "$(uname -m)" = aarch64 -o "$(uname -m)" = arm64
      - uses: actions/download-artifact@v4
        with:
          name: qwen-latency-confirm-probe-bundle
          path: ${{ runner.temp }}/qwen-latency-confirm-bundle
      - name: Verify probe integrity and LlamaPi preconditions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qwen-latency-confirm-bundle"
          test "$(cat source-sha.txt)" = "$GITHUB_SHA"
          sha256sum -c bundle.sha256
          python3 -m py_compile probe-llamapi-qwen-routing.py
          systemctl is-active llamapi-server.service | tee "$RUNNER_TEMP/llamapi-service-state.txt"
          curl -fsS "$LLAMAPI_BASE_URL/models" | tee "$RUNNER_TEMP/llamapi-models.json"
          echo '--- unrelated TCP/8000 observation only ---' | tee "$RUNNER_TEMP/port-8000.txt"
          ss -ltnp 'sport = :8000' 2>&1 | tee -a "$RUNNER_TEMP/port-8000.txt" || true
      - name: A1 full
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qwen-latency-confirm-bundle/probe-llamapi-qwen-routing.py" --base-url "$LLAMAPI_BASE_URL" --model-hint "$LLAMAPI_MODEL_HINT" --protocol full --repetitions 1 --timeout 120 --output "$RUNNER_TEMP/full-1.json"
      - name: B1 compact
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qwen-latency-confirm-bundle/probe-llamapi-qwen-routing.py" --base-url "$LLAMAPI_BASE_URL" --model-hint "$LLAMAPI_MODEL_HINT" --protocol compact --repetitions 1 --timeout 120 --output "$RUNNER_TEMP/compact-1.json"
      - name: B2 compact
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qwen-latency-confirm-bundle/probe-llamapi-qwen-routing.py" --base-url "$LLAMAPI_BASE_URL" --model-hint "$LLAMAPI_MODEL_HINT" --protocol compact --repetitions 1 --timeout 120 --output "$RUNNER_TEMP/compact-2.json"
      - name: A2 full
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qwen-latency-confirm-bundle/probe-llamapi-qwen-routing.py" --base-url "$LLAMAPI_BASE_URL" --model-hint "$LLAMAPI_MODEL_HINT" --protocol full --repetitions 1 --timeout 120 --output "$RUNNER_TEMP/full-2.json"
      - name: Aggregate ABBA evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, statistics
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          paths = {
              'full': [root / 'full-1.json', root / 'full-2.json'],
              'compact': [root / 'compact-1.json', root / 'compact-2.json'],
          }

          def percentile(values, q):
              vals = sorted(values)
              if not vals:
                  return None
              if len(vals) == 1:
                  return vals[0]
              pos = (len(vals) - 1) * q
              lo = int(pos)
              hi = min(lo + 1, len(vals) - 1)
              frac = pos - lo
              return vals[lo] + (vals[hi] - vals[lo]) * frac

          def collect(protocol):
              reports = [json.loads(p.read_text(encoding='utf-8')) for p in paths[protocol]]
              for report in reports:
                  if report.get('success') is not True:
                      raise SystemExit(f'{protocol} semantic failure')
                  if report.get('protocol') != protocol:
                      raise SystemExit(f'{protocol} protocol mismatch')
                  if report.get('effective_decision_count') != 5 or report.get('model_inference_count') != 3:
                      raise SystemExit(f'{protocol} unexpected counts')
              samples = [s for r in reports for s in r.get('samples', []) if s.get('route_source') == 'MODEL']
              if len(samples) != 6 or not all(s.get('passed') is True for s in samples):
                  raise SystemExit(f'{protocol} expected six passing model samples')
              lat = [float(s['latency_ms']) for s in samples]
              usage = [s['telemetry']['usage'] for s in samples]
              pt = [int(u['prompt_tokens']) for u in usage]
              ct = [int(u['completion_tokens']) for u in usage]
              return {
                  'model_samples': len(samples),
                  'latency_ms': {
                      'p50': round(percentile(lat, 0.50), 3),
                      'p95': round(percentile(lat, 0.95), 3),
                      'mean': round(statistics.mean(lat), 3),
                      'min': round(min(lat), 3),
                      'max': round(max(lat), 3),
                      'samples': lat,
                  },
                  'prompt_tokens_mean': round(statistics.mean(pt), 2),
                  'completion_tokens_mean': round(statistics.mean(ct), 2),
                  'prompt_tokens': pt,
                  'completion_tokens': ct,
              }

          full = collect('full')
          compact = collect('compact')
          def pct(new, old):
              return round((new - old) / old * 100.0, 2)
          out = {
              'source_sha': os.environ.get('GITHUB_SHA'),
              'order': ['full-1', 'compact-1', 'compact-2', 'full-2'],
              'full': full,
              'compact': compact,
              'delta_compact_vs_full_pct': {
                  'latency_p50': pct(compact['latency_ms']['p50'], full['latency_ms']['p50']),
                  'latency_p95': pct(compact['latency_ms']['p95'], full['latency_ms']['p95']),
                  'latency_mean': pct(compact['latency_ms']['mean'], full['latency_ms']['mean']),
                  'completion_tokens_mean': pct(compact['completion_tokens_mean'], full['completion_tokens_mean']),
                  'prompt_tokens_mean': pct(compact['prompt_tokens_mean'], full['prompt_tokens_mean']),
              },
              'semantic_requirement': 'all four 5-decision probes and all 12 model samples passed',
          }
          (root / 'qwen-latency-abba-confirmation.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Final read-only diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          systemctl --no-pager --full status llamapi-server.service || true
          cat "$RUNNER_TEMP/qwen-latency-abba-confirmation.json" 2>/dev/null || true
          cat "$RUNNER_TEMP/port-8000.txt" 2>/dev/null || true
      - name: Upload confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-qwen-routing-latency-confirm-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/full-1.json
            ${{ runner.temp }}/compact-1.json
            ${{ runner.temp }}/compact-2.json
            ${{ runner.temp }}/full-2.json
            ${{ runner.temp }}/qwen-latency-abba-confirmation.json
            ${{ runner.temp }}/llamapi-service-state.txt
            ${{ runner.temp }}/llamapi-models.json
            ${{ runner.temp }}/port-8000.txt
          if-no-files-found: warn
          retention-days: 14
