name: Task 12 XVector Legacy Runtime Diagnostic

on:
  push:
    branches:
      - feat/dual-speaker-backends
    paths:
      - '.github/workflows/task12-xvector-legacy-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner-temp-only diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/task12-xvector-legacy-diagnostic.yml').read_text(encoding='utf-8')
          board=text.split('\n  board-diagnostic:\n',1)[1]
          forbidden=['apt install','systemctl ','snapshot_download','rm -rf /opt','SUSPECT_SPEAKER_BACKEND=','--user','--prefix /opt']
          for token in forbidden:
              if token in board:
                  raise SystemExit(f'forbidden mutation token: {token}')
          required=[
              'LEGACY_ROOT="$RUNNER_TEMP/task12-funasr-legacy"',
              '--no-deps --target "$LEGACY_TARGET" "funasr==$version"',
              '--no-deps --target "$LEGACY_TARGET" "humanfriendly==10.0"',
              '--no-deps --target "$LEGACY_TARGET" editdistance pytorch_wpe',
              'LEGACY_DEPENDENCY_INVENTORY=',
              'for version in 0.8.4 0.8.6; do',
              'rm -rf "$LEGACY_ROOT"',
          ]
          for token in required:
              if token not in board:
                  raise SystemExit(f'missing runner-temp isolation token: {token}')
          print('TASK12_XVECTOR_LEGACY_TEMP_DIAGNOSTIC_SAFE')
          PY

  board-diagnostic:
    needs: hosted-safety
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 25
    steps:
      - name: Test adjacent published legacy FunASR runtimes in runner temp
        shell: bash
        run: |
          set -euo pipefail
          PY=/opt/suspect-interrogation/runtime/funasr-env/bin/python
          MODEL_ROOT=/home/youyeetoo/funasr-models/xvector
          LEGACY_ROOT="$RUNNER_TEMP/task12-funasr-legacy"
          test -x "$PY"
          test -f "$MODEL_ROOT/sv.yaml"
          test -f "$MODEL_ROOT/sv.pth"
          rm -rf "$LEGACY_ROOT"
          mkdir -p "$LEGACY_ROOT"
          winner=''

          for version in 0.8.4 0.8.6; do
            LEGACY_TARGET="$LEGACY_ROOT/$version"
            echo "=== FUNASR_LEGACY_CANDIDATE=$version ==="
            rm -rf "$LEGACY_TARGET"
            mkdir -p "$LEGACY_TARGET"
            if ! "$PY" -m pip install --disable-pip-version-check --no-deps --target "$LEGACY_TARGET" "funasr==$version"; then
              echo "candidate=$version install_ok=false"
              continue
            fi
            "$PY" -m pip install --disable-pip-version-check --no-deps --target "$LEGACY_TARGET" "humanfriendly==10.0"
            "$PY" -m pip install --disable-pip-version-check --no-deps --target "$LEGACY_TARGET" editdistance pytorch_wpe
            PYTHONPATH="$LEGACY_TARGET" PYTHONNOUSERSITE=1 "$PY" - <<'PY'
          import importlib.util, json
          modules = [
              'humanfriendly', 'scipy', 'librosa', 'jamo', 'yaml', 'soundfile',
              'kaldiio', 'torch_complex', 'sentencepiece', 'jieba', 'pytorch_wpe',
              'editdistance', 'oss2', 'tqdm', 'umap', 'jaconv', 'hydra',
              'tensorboardX', 'requests', 'numpy', 'torch', 'torchaudio', 'modelscope',
          ]
          availability = {name: importlib.util.find_spec(name) is not None for name in modules}
          missing = sorted(name for name, present in availability.items() if not present)
          print('LEGACY_DEPENDENCY_INVENTORY=' + json.dumps({'missing': missing, 'availability': availability}, sort_keys=True))
          if missing:
              raise SystemExit('legacy dependency inventory still incomplete: ' + ','.join(missing))
          PY
            if [[ ! -f "$LEGACY_TARGET/funasr/bin/sv_infer.py" ]]; then
              echo "candidate=$version sv_infer_present=false"
              continue
            fi

            if PYTHONPATH="$LEGACY_TARGET" PYTHONNOUSERSITE=1 MODELSCOPE_OFFLINE=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
              "$PY" - "$MODEL_ROOT" "$version" <<'PY'
          import json, math, sys, time
          root, expected_version=sys.argv[1], sys.argv[2]
          report={'python': sys.executable, 'candidate_version': expected_version}
          try:
              import funasr
              report['funasr_version']=getattr(funasr,'__version__','unknown')
              from funasr.bin.sv_infer import Speech2Xvector
              started=time.perf_counter()
              runtime=Speech2Xvector(
                  sv_train_config=root + '/sv.yaml',
                  sv_model_file=root + '/sv.pth',
                  device='cpu',
                  dtype='float32',
                  embedding_node='resnet1_dense',
              )
              report['legacy_import_ok']=True
              report['legacy_load_ok']=True
              report['load_seconds']=round(time.perf_counter()-started,6)

              import numpy as np
              sample_rate=16000
              seconds=2
              t=np.arange(sample_rate * seconds, dtype=np.float32) / sample_rate
              audio=(0.08*np.sin(2*np.pi*220.0*t) + 0.03*np.sin(2*np.pi*440.0*t)).astype(np.float32)
              infer_started=time.perf_counter()
              embedding=runtime.calculate_embedding(audio).squeeze(0).detach().cpu().numpy().reshape(-1)
              report['embedding_ok']=True
              report['embedding_dim']=int(embedding.size)
              report['embedding_norm']=round(float(np.linalg.norm(embedding)),6)
              report['embedding_latency_ms']=round((time.perf_counter()-infer_started)*1000.0,3)
              if embedding.size <= 0 or not np.all(np.isfinite(embedding)) or not math.isfinite(report['embedding_norm']):
                  raise RuntimeError('legacy XVector produced invalid embedding')
          except Exception as exc:
              report.setdefault('legacy_import_ok', False)
              report.setdefault('legacy_load_ok', False)
              report.setdefault('embedding_ok', False)
              report['error_type']=type(exc).__name__
              report['error']=str(exc)[:1000]
          print(json.dumps(report,ensure_ascii=False,sort_keys=True))
          if not report.get('legacy_load_ok') or not report.get('embedding_ok'):
              raise SystemExit(1)
          PY
            then
              winner="$version"
              echo "TASK12_XVECTOR_LEGACY_RUNTIME_OK version=$version"
              break
            else
              echo "candidate=$version runtime_ok=false"
            fi
          done

          if [[ -z "$winner" ]]; then
            echo 'NO_COMPATIBLE_PUBLISHED_LEGACY_FUNASR_RUNTIME' >&2
            exit 1
          fi
          echo "FUNASR_LEGACY_WINNER=$winner"

      - name: Cleanup runner-temp legacy packages
        if: always()
        shell: bash
        run: |
          set +e
          LEGACY_ROOT="$RUNNER_TEMP/task12-funasr-legacy"
          rm -rf "$LEGACY_ROOT"
