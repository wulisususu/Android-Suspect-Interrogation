name: Task 12 Dual Speaker Probe RED

on:
  push:
    branches:
      - feat/dual-speaker-backends
    paths:
      - 'tests/release/test_rk3588_dual_speaker_probes.py'
      - '.github/workflows/task12-dual-probe-red.yml'

permissions:
  contents: read

jobs:
  task12-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt
      - name: Install release-test dependencies
        run: python -m pip install -r linux/backend/requirements.txt pytest
      - name: Task 12 dual speaker probe contract
        env:
          PYTHONPATH: linux/backend
          HARDWARE_MODE: mock
          DEVICE_SIMULATOR: '1'
          AI_MODE: mock
        run: python -m pytest -q tests/release/test_rk3588_dual_speaker_probes.py
