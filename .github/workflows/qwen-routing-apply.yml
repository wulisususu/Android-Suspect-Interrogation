name: Qwen Routing Patch Gate

on:
  push:
    branches:
      - feat/qwen-formal-record-routing
    paths:
      - '.superpowers/qwen-routing-apply.patch'

permissions:
  contents: write

concurrency:
  group: qwen-routing-apply
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: linux/backend
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: '1'
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/qwen-formal-record-routing

      - name: Apply proposed patch
        shell: bash
        run: |
          set -euo pipefail
          test -s .superpowers/qwen-routing-apply.patch
          git apply --check .superpowers/qwen-routing-apply.patch
          git apply .superpowers/qwen-routing-apply.patch

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r linux/backend/requirements.txt pytest httpx

      - name: Backend verification
        run: |
          python -m compileall -q linux/backend
          python -m pytest linux/backend/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Frontend verification
        working-directory: webapp
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qwen-routing-ci'
          git config user.email 'qwen-routing-ci@users.noreply.github.com'
          git add -A ':!.superpowers/qwen-routing-apply.patch'
          if git diff --cached --quiet; then
            echo 'Patch produced no tracked code changes' >&2
            exit 1
          fi
          subject="$(sed -n '1s/^# commit: //p' .superpowers/qwen-routing-apply.patch)"
          if [[ -z "$subject" ]]; then
            subject='feat: apply verified qwen routing patch'
          fi
          git commit -m "$subject"
          git push origin HEAD:feat/qwen-formal-record-routing
