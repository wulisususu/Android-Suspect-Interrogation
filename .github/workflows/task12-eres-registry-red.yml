name: Task 12 ERes Registry RED

on:
  push:
    branches:
      - feat/dual-speaker-backends
    paths:
      - 'tests/release/test_eres2net_registry_manifest.py'
      - '.github/workflows/task12-eres-registry-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real-package registry contract
        run: python -m pytest -q tests/release/test_eres2net_registry_manifest.py
