name: Linux CI

on:
  push:
    branches:
      - linux-release-hardening
    paths:
      - '.github/workflows/linux-ci.yml'
      - 'linux/**'
      - 'webapp/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'tests/**'
      - 'docs/release/**'
      - 'docs/security/**'
  pull_request:
    paths:
      - '.github/workflows/linux-ci.yml'
      - 'linux/**'
      - 'webapp/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'tests/**'
      - 'docs/release/**'
      - 'docs/security/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-contract-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: linux/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Run health contract tests
        run: python -m pytest tests/test_health_contract.py tests/test_capability_health.py -q
