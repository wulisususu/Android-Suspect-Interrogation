name: One-shot branch consolidation cleanup

on:
  push:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/branch-consolidation-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: branch-consolidation-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 10
    steps:
      - name: Verify RK3588 runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          hostname
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Delete every remote branch except linux-adaptation and main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          keep = {'linux-adaptation', 'main'}
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'rk3588-branch-consolidation-cleanup',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read()
                  return json.loads(body) if body else None

          branches_url = f'https://api.github.com/repos/{repo}/branches?per_page=100'
          branches = request(branches_url)
          names = [item['name'] for item in branches]
          print('branches_before=', names)

          for name in names:
              if name in keep:
                  continue
              ref = urllib.parse.quote(f'heads/{name}', safe='/')
              url = f'https://api.github.com/repos/{repo}/git/refs/{ref}'
              print('deleting=', name)
              request(url, method='DELETE')

          remaining = request(branches_url)
          remaining_names = sorted(item['name'] for item in remaining)
          print('branches_after=', remaining_names)
          expected = sorted(keep)
          if remaining_names != expected:
              raise SystemExit(f'branch cleanup incomplete: expected {expected}, got {remaining_names}')
          print('BRANCH_CONSOLIDATION_CLEANUP_OK')
          PY
