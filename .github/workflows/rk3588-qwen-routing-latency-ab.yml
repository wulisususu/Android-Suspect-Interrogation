name: RK3588 Qwen Routing Latency A-B

on:
  workflow_dispatch:
  push:
    branches:
      - perf/qwen-routing-latency-experiment
    paths:
      - '.github/workflows/rk3588-qwen-routing-latency-ab.yml'
      - 'scripts/ci/probe-llamapi-qwen-routing.py'
      - 'linux/backend/tests/test_probe_qwen_compact_protocol.py'
      - 'linux/backend/tests/test_probe_llamapi_qwen_routing.py'

permissions:
  contents: read

concurrency:
  group: rk3588-qwen-routing-latency-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-gate:
    name: Hosted compact-protocol gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: linux/backend
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: '1'
      AI_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r linux/backend/requirements.txt pytest httpx

      - name: Verify full and compact probe contracts
        run: |
          python -m py_compile scripts/ci/probe-llamapi-qwen-routing.py
          python -m pytest \
            linux/backend/tests/test_probe_llamapi_qwen_routing.py \
            linux/backend/tests/test_probe_qwen_compact_protocol.py -q

      - name: Stage verified probe
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/qwen-latency-ab-bundle"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE"
          cp scripts/ci/probe-llamapi-qwen-routing.py "$BUNDLE/"
          printf '%s\n' "$GITHUB_SHA" > "$BUNDLE/source-sha.txt"
          (
            cd "$BUNDLE"
            sha256sum probe-llamapi-qwen-routing.py > bundle.sha256
          )

      - name: Upload verified probe
        uses: actions/upload-artifact@v4
        with:
          name: qwen-latency-ab-probe-bundle
          path: ${{ runner.temp }}/qwen-latency-ab-bundle/
          if-no-files-found: error
          retention-days: 3

  rk3588-ab:
    name: RK3588 full vs compact A-B
    needs: hosted-gate
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 15
    env:
      LLAMAPI_BASE_URL: 'http://127.0.0.1:9265/v1'
      LLAMAPI_MODEL_HINT: 'qwen3:4b'
    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          hostname
          uname -a
          test "$(uname -m)" = aarch64 -o "$(uname -m)" = arm64

      - name: Download hosted-verified probe
        uses: actions/download-artifact@v4
        with:
          name: qwen-latency-ab-probe-bundle
          path: ${{ runner.temp }}/qwen-latency-ab-bundle

      - name: Verify probe integrity and source revision
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qwen-latency-ab-bundle"
          test "$(cat source-sha.txt)" = "$GITHUB_SHA"
          sha256sum -c bundle.sha256
          python3 -m py_compile probe-llamapi-qwen-routing.py

      - name: Verify LlamaPi preconditions without mutation
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active llamapi-server.service | tee "$RUNNER_TEMP/llamapi-service-state.txt"
          curl -fsS "$LLAMAPI_BASE_URL/models" | tee "$RUNNER_TEMP/llamapi-models.json"
          echo '--- unrelated TCP/8000 observation only ---' | tee "$RUNNER_TEMP/port-8000.txt"
          ss -ltnp 'sport = :8000' 2>&1 | tee -a "$RUNNER_TEMP/port-8000.txt" || true

      - name: Run full protocol baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qwen-latency-ab-bundle/probe-llamapi-qwen-routing.py" \
            --base-url "$LLAMAPI_BASE_URL" \
            --model-hint "$LLAMAPI_MODEL_HINT" \
            --protocol full \
            --repetitions 1 \
            --timeout 120 \
            --output "$RUNNER_TEMP/qwen-latency-full.json"

      - name: Run compact protocol candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qwen-latency-ab-bundle/probe-llamapi-qwen-routing.py" \
            --base-url "$LLAMAPI_BASE_URL" \
            --model-hint "$LLAMAPI_MODEL_HINT" \
            --protocol compact \
            --repetitions 1 \
            --timeout 120 \
            --output "$RUNNER_TEMP/qwen-latency-compact.json"

      - name: Compare semantic validity, tokens, and latency
        shell: bash
        run: |
          set -euo pipefail
          FULL="$RUNNER_TEMP/qwen-latency-full.json" COMPACT="$RUNNER_TEMP/qwen-latency-compact.json" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from statistics import mean

          full = json.loads(Path(os.environ['FULL']).read_text(encoding='utf-8'))
          compact = json.loads(Path(os.environ['COMPACT']).read_text(encoding='utf-8'))

          for label, report, protocol in [('full', full, 'full'), ('compact', compact, 'compact')]:
              if report.get('success') is not True:
                  raise SystemExit(f'{label} semantic probe failed')
              if report.get('protocol') != protocol:
                  raise SystemExit(f'{label} protocol mismatch: {report.get("protocol")!r}')
              if report.get('effective_decision_count') != 5 or report.get('model_inference_count') != 3:
                  raise SystemExit(f'{label} unexpected decision/inference count')

          def metrics(report):
              telemetry = [
                  row.get('telemetry') for row in report.get('samples', [])
                  if isinstance(row, dict) and isinstance(row.get('telemetry'), dict)
              ]
              usages = [row.get('usage') for row in telemetry if isinstance(row.get('usage'), dict)]
              prompts = [u['prompt_tokens'] for u in usages if isinstance(u.get('prompt_tokens'), int)]
              completions = [u['completion_tokens'] for u in usages if isinstance(u.get('completion_tokens'), int)]
              totals = [u['total_tokens'] for u in usages if isinstance(u.get('total_tokens'), int)]
              return {
                  'latency_ms': report.get('latency_ms'),
                  'prompt_tokens': prompts,
                  'completion_tokens': completions,
                  'total_tokens': totals,
                  'prompt_tokens_mean': round(mean(prompts), 2) if prompts else None,
                  'completion_tokens_mean': round(mean(completions), 2) if completions else None,
                  'total_tokens_mean': round(mean(totals), 2) if totals else None,
                  'prompt_chars': [row.get('prompt_chars') for row in telemetry],
                  'response_chars': [row.get('response_chars') for row in telemetry],
              }

          fm = metrics(full)
          cm = metrics(compact)

          def pct(new, old):
              if not isinstance(new, (int, float)) or not isinstance(old, (int, float)) or old == 0:
                  return None
              return round((new - old) / old * 100.0, 2)

          comparison = {
              'source_sha': os.environ.get('GITHUB_SHA'),
              'host': full.get('host'),
              'model_id': full.get('model_id'),
              'full': fm,
              'compact': cm,
              'delta_compact_vs_full_pct': {
                  'p50': pct(cm['latency_ms'].get('p50'), fm['latency_ms'].get('p50')),
                  'p95': pct(cm['latency_ms'].get('p95'), fm['latency_ms'].get('p95')),
                  'max': pct(cm['latency_ms'].get('max'), fm['latency_ms'].get('max')),
                  'prompt_tokens_mean': pct(cm['prompt_tokens_mean'], fm['prompt_tokens_mean']),
                  'completion_tokens_mean': pct(cm['completion_tokens_mean'], fm['completion_tokens_mean']),
                  'total_tokens_mean': pct(cm['total_tokens_mean'], fm['total_tokens_mean']),
              },
              'sample_note': 'exploratory one-cycle A/B; 3 model calls per protocol',
          }
          path = Path(os.environ['RUNNER_TEMP'], 'qwen-latency-ab-comparison.json')
          path.write_text(json.dumps(comparison, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(comparison, ensure_ascii=False, indent=2))
          PY

      - name: Final read-only diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          systemctl --no-pager --full status llamapi-server.service || true
          echo '--- models ---'
          cat "$RUNNER_TEMP/llamapi-models.json" 2>/dev/null || true
          echo '--- A/B comparison ---'
          cat "$RUNNER_TEMP/qwen-latency-ab-comparison.json" 2>/dev/null || true
          echo '--- unrelated TCP/8000 observation ---'
          cat "$RUNNER_TEMP/port-8000.txt" 2>/dev/null || true

      - name: Upload RK3588 latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-qwen-routing-latency-ab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/llamapi-service-state.txt
            ${{ runner.temp }}/llamapi-models.json
            ${{ runner.temp }}/qwen-latency-full.json
            ${{ runner.temp }}/qwen-latency-compact.json
            ${{ runner.temp }}/qwen-latency-ab-comparison.json
            ${{ runner.temp }}/port-8000.txt
          if-no-files-found: warn
          retention-days: 14
