name: Qwen Routing Dev CI

# Acceptance revision: structured routing output budget = 192 tokens.
on:
  push:
    branches:
      - feat/qwen-formal-record-routing
    paths:
      - '.github/workflows/qwen-routing-dev-ci.yml'
      - 'linux/**'
      - 'webapp/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: qwen-routing-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: linux/backend
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: '1'
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt
      - run: python -m pip install -r linux/backend/requirements.txt pytest httpx
      - run: python -m compileall -q linux/backend
      - name: Backend tests
        run: python -m pytest linux/backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
        working-directory: webapp
      - run: npm test
        working-directory: webapp
      - run: npm run typecheck
        working-directory: webapp
      - run: npm run build
        working-directory: webapp
