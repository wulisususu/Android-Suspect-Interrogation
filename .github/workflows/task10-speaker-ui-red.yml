name: Task 10 Speaker UI RED

on:
  push:
    branches:
      - feat/dual-speaker-backends
    paths:
      - linux/backend/tests/test_speaker_runtime_api.py
      - linux/backend/tests/test_speaker_runtime_reconfigure.py
      - webapp/src/components/SpeakerBackendControls.test.ts
      - .github/workflows/task10-speaker-ui-red.yml
  workflow_dispatch:

jobs:
  task10-red:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: linux/backend
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: "1"
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r linux/backend/requirements.txt pytest httpx
      - name: Backend Task 10 contract
        run: |
          python -m pytest -q \
            linux/backend/tests/test_speaker_runtime_api.py \
            linux/backend/tests/test_speaker_runtime_reconfigure.py
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install web dependencies
        if: always()
        working-directory: webapp
        run: npm ci
      - name: Vue Task 10 contract
        if: always()
        working-directory: webapp
        run: npm test -- --run src/components/SpeakerBackendControls.test.ts
