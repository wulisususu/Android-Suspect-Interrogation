name: RK3588 Closeout Repair Deploy

on:
  push:
    branches:
      - feature/funasr-asr-capture
    paths:
      - '.github/workflows/rk3588-closeout-repair.yml'

permissions:
  contents: read

concurrency:
  group: rk3588-closeout-repair
  cancel-in-progress: false

jobs:
  repair-deploy:
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 60
    env:
      GIT_TERMINAL_PROMPT: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SUSPECT_DEPLOY_PORT: '18080'
      MODELSCOPE_PACKAGE_VERSION: '1.39.1'
      FUNASR_RUNTIME: '/opt/suspect-interrogation/runtime/funasr-env'
      FUNASR_MODEL_ROOT: '/opt/suspect-interrogation/models/funasr'

    steps:
      - name: RK3588 runner and port preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "hostname=$(hostname)"
          uname -a
          test "$(uname -m)" = aarch64 -o "$(uname -m)" = arm64
          sudo -n true
          echo '--- preserve TCP/8000 ---'
          sudo -n ss -ltnp 'sport = :8000' || true
          echo '--- current TCP/18080 ---'
          sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" || true

      - name: Exact feature checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local http.version HTTP/1.1
          git sparse-checkout init --cone
          git sparse-checkout set .github linux webapp deploy scripts systemd tests docs
          fetched=0
          for attempt in 1 2 3 4 5; do
            if timeout 120s git -c protocol.version=2 fetch --filter=blob:none --no-tags --depth=1 \
              origin "+${GITHUB_SHA}:refs/remotes/origin/__closeout_target"; then
              fetched=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$fetched" -eq 1
          git checkout --force --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "deployed_candidate_sha=$(git rev-parse HEAD)"

      - name: Repair isolated legacy XVector runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x "$FUNASR_RUNTIME/bin/python"
          test -d "$FUNASR_MODEL_ROOT/paraformer"
          test -d "$FUNASR_MODEL_ROOT/fsmn-vad"
          test -d "$FUNASR_MODEL_ROOT/xvector"
          if ! sudo -n "$FUNASR_RUNTIME/bin/python" -c 'import modelscope; assert modelscope.__version__ == "1.39.1"' >/dev/null 2>&1; then
            sudo -n "$FUNASR_RUNTIME/bin/python" -m pip install --retries 3 --timeout 60 \
              "modelscope==${MODELSCOPE_PACKAGE_VERSION}"
          fi
          sudo -n "$FUNASR_RUNTIME/bin/python" -c 'import funasr, torch, torchaudio, modelscope, numpy, soundfile; print("funasr="+str(funasr.__version__)); print("torch="+str(torch.__version__)); print("torchaudio="+str(torchaudio.__version__)); print("modelscope="+str(modelscope.__version__))'
          sudo -n chown -R root:root "$FUNASR_RUNTIME"
          sudo -n chmod -R go-w "$FUNASR_RUNTIME"

      - name: Real Paraformer VAD XVector probe
        shell: bash
        run: |
          set -euo pipefail
          MODEL_ROOT="$FUNASR_MODEL_ROOT" sudo -n -E "$FUNASR_RUNTIME/bin/python" scripts/ci/probe-funasr-runtime.py \
            --speech-wav "$FUNASR_MODEL_ROOT/paraformer/example/asr_example.wav" \
            --speaker-wav "$FUNASR_MODEL_ROOT/xvector/example/sv_example_enroll.wav" \
            --output "$RUNNER_TEMP/closeout-funasr-probe.json"
          cat "$RUNNER_TEMP/closeout-funasr-probe.json"
          "$FUNASR_RUNTIME/bin/python" - "$RUNNER_TEMP/closeout-funasr-probe.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1], encoding='utf-8'))
          assert report['success'] is True, report
          assert report['models']['paraformer']['load_ok'] is True
          assert report['models']['fsmn-vad']['load_ok'] is True
          assert report['models']['xvector']['load_ok'] is True
          assert report['models']['xvector']['inference_ok'] is True
          print('FUNASR_THREE_MODEL_PROBE_OK')
          PY

      - name: Deploy exact feature release
        shell: bash
        run: |
          set -euo pipefail
          sudo -n bash deploy/control.sh install
          RUNTIME_ENV=/etc/suspect-interrogation/runtime.env
          upsert() {
            local key="$1" value="$2"
            if sudo -n grep -q "^${key}=" "$RUNTIME_ENV"; then
              sudo -n sed -i -E "s|^${key}=.*|${key}=${value}|" "$RUNTIME_ENV"
            else
              printf '%s=%s\n' "$key" "$value" | sudo -n tee -a "$RUNTIME_ENV" >/dev/null
            fi
          }
          upsert SUSPECT_API_PORT "$SUSPECT_DEPLOY_PORT"
          upsert AI_MODE real
          sudo -n systemctl daemon-reload
          sudo -n env SUSPECT_HEALTH_BASE_URL="http://127.0.0.1:${SUSPECT_DEPLOY_PORT}" \
            bash deploy/control.sh deploy "$GITHUB_WORKSPACE"
          sudo -n systemctl enable --now ai-worker.service

      - name: Verify deployed board runtime
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            if systemctl is-active --quiet interrogation-api.service && \
               systemctl is-active --quiet ai-worker.service && \
               [[ -S /run/suspect-interrogation/speech.sock ]]; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet interrogation-api.service
          systemctl is-active --quiet ai-worker.service
          test -S /run/suspect-interrogation/speech.sock
          PYTHONPATH=/opt/suspect-interrogation/current/linux/backend \
            "$FUNASR_RUNTIME/bin/python" - <<'PY'
          from app.ai.speech.client import SpeechWorkerClient
          health=SpeechWorkerClient('/run/suspect-interrogation/speech.sock', timeout=30).health()
          models=health.get('models') or {}
          assert models.get('asr') is True, health
          assert models.get('vad') is True, health
          assert models.get('speaker') is True, health
          print('SPEECH_WORKER_HEALTH_OK', health)
          PY
          curl -fsS "http://127.0.0.1:${SUSPECT_DEPLOY_PORT}/health/ready"
          curl -fsS "http://127.0.0.1:${SUSPECT_DEPLOY_PORT}/" | grep -q '<div id="app"></div>'
          echo "current_release=$(readlink -f /opt/suspect-interrogation/current)"
          echo '--- TCP/18080 ---'
          sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" || true
          echo '--- TCP/8000 preserved ---'
          sudo -n ss -ltnp 'sport = :8000' || true
          echo 'RK3588_CLOSEOUT_DEPLOY_OK'

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          echo '--- release ---'; readlink -f /opt/suspect-interrogation/current || true
          echo '--- services ---'; sudo -n systemctl --no-pager --full status interrogation-api.service ai-worker.service || true
          echo '--- ai-worker journal ---'; sudo -n journalctl -u ai-worker.service -n 160 --no-pager || true
          echo '--- api journal ---'; sudo -n journalctl -u interrogation-api.service -n 120 --no-pager || true
          echo '--- ports ---'; sudo -n ss -ltnp 'sport = :18080' || true; sudo -n ss -ltnp 'sport = :8000' || true
