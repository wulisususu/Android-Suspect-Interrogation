name: RK3588 Network Surface Diagnostics

on:
  push:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/rk3588-network-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rk3588-network-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Sanitized network and TLS diagnostics
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 10
    steps:
      - name: Listener summary without private addresses
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          for port in 80 443 8000 18080; do
            line="$(sudo -n ss -H -ltnp 2>/dev/null | awk -v p=":${port}" '$4 ~ p"$" {print; exit}')"
            if [[ -z "$line" ]]; then
              echo "port_${port}=free"
              continue
            fi
            local_addr="$(awk '{print $4}' <<<"$line")"
            owner="$(sed -n 's/.*users:(("\([^"]*\)".*/\1/p' <<<"$line")"
            [[ -n "$owner" ]] || owner=unknown
            case "$local_addr" in
              127.0.0.1:*|'[::1]':*) scope=loopback ;;
              0.0.0.0:*|'[::]':*) scope=all_interfaces ;;
              *) scope=specific_interface ;;
            esac
            echo "port_${port}=listening scope=${scope} process=${owner}"
          done

      - name: Reverse proxy and tunnel software presence
        shell: bash
        run: |
          set -euo pipefail
          for binary in caddy nginx cloudflared frpc frps; do
            if command -v "$binary" >/dev/null 2>&1; then
              echo "binary_${binary}=present"
            else
              echo "binary_${binary}=absent"
            fi
          done
          units="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -Ei '^(caddy|nginx|cloudflared|frpc|frps|frp)[^/]*\.service$' || true)"
          if [[ -z "$units" ]]; then
            echo 'matching_proxy_tunnel_units=none'
          else
            while IFS= read -r unit; do
              [[ -n "$unit" ]] || continue
              state="$(systemctl is-active "$unit" 2>/dev/null || true)"
              echo "service=${unit} state=${state}"
            done <<<"$units"
          fi

      - name: Classify FRP mapping without exposing endpoint or credentials
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v frpc >/dev/null 2>&1; then
            echo 'frpc_config_found=false'
            exit 0
          fi
          echo "frpc_version=$(frpc --version 2>/dev/null | head -n 1 | tr -cd '[:alnum:]._-')"
          exec_line="$(systemctl show frpc.service --property=ExecStart --value 2>/dev/null || true)"
          config="$(grep -oE '/[^ ;{}]+\.(toml|ini)' <<<"$exec_line" | head -n 1 || true)"
          if [[ -z "$config" || ! -f "$config" ]]; then
            for root in /etc /opt /usr/local/etc /home; do
              [[ -d "$root" ]] || continue
              config="$(sudo -n find "$root" -maxdepth 5 -type f \( -name 'frpc.toml' -o -name 'frpc.ini' \) -print -quit 2>/dev/null || true)"
              [[ -n "$config" ]] && break
            done
          fi
          if [[ -z "$config" || ! -f "$config" ]]; then
            echo 'frpc_config_found=false'
            exit 0
          fi
          echo 'frpc_config_found=true'
          sudo -n python3 - "$config" <<'PY'
          import configparser
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          mappings = []
          if path.suffix.lower() == '.toml':
              text = path.read_text(encoding='utf-8', errors='replace')
              blocks = re.split(r'^\s*\[\[proxies\]\]\s*$', text, flags=re.MULTILINE)[1:]
              for block in blocks:
                  def scalar(name):
                      match = re.search(r'^\s*' + re.escape(name) + r'\s*=\s*([^#\r\n]+)', block, flags=re.MULTILINE)
                      return match.group(1).strip() if match else ''
                  type_value = scalar('type').strip('"\'').lower()
                  local_raw = scalar('localPort')
                  local_match = re.search(r'\d+', local_raw)
                  local_port = int(local_match.group(0)) if local_match else 0
                  mappings.append({
                      'type': type_value,
                      'local_port': local_port,
                      'remote_port': bool(scalar('remotePort')),
                      'custom_domain': bool(scalar('customDomains')),
                      'subdomain': bool(scalar('subdomain')),
                  })
          else:
              parser = configparser.ConfigParser(interpolation=None)
              parser.read(path, encoding='utf-8')
              for section in parser.sections():
                  if section.lower() == 'common':
                      continue
                  values = parser[section]
                  try:
                      local_port = int(values.get('local_port', '0'))
                  except ValueError:
                      local_port = 0
                  mappings.append({
                      'type': values.get('type', '').lower(),
                      'local_port': local_port,
                      'remote_port': bool(values.get('remote_port')),
                      'custom_domain': bool(values.get('custom_domains')),
                      'subdomain': bool(values.get('subdomain')),
                  })

          relevant = [item for item in mappings if item['local_port'] == 18080]
          print(f'frpc_proxy_count={len(mappings)}')
          print(f'frpc_maps_18080={str(bool(relevant)).lower()}')
          print('frpc_18080_types=' + (','.join(sorted({item['type'] or 'unknown' for item in relevant})) or 'none'))
          print(f'frpc_18080_has_remote_port={str(any(item["remote_port"] for item in relevant)).lower()}')
          print(f'frpc_18080_has_vhost_name={str(any(item["custom_domain"] or item["subdomain"] for item in relevant)).lower()}')
          print(f'frpc_any_http_vhost={str(any(item["type"] == "http" and (item["custom_domain"] or item["subdomain"]) for item in mappings)).lower()}')
          print(f'frpc_any_https_vhost={str(any(item["type"] == "https" and (item["custom_domain"] or item["subdomain"]) for item in mappings)).lower()}')
          PY

      - name: Known configuration locations without contents
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            /etc/caddy/Caddyfile \
            /etc/nginx/nginx.conf \
            /etc/frp/frpc.toml \
            /etc/frp/frpc.ini \
            /etc/cloudflared/config.yml \
            /etc/cloudflared/config.yaml; do
            if sudo -n test -e "$path"; then
              echo "known_config_present=true kind=$(basename "$path")"
            fi
          done

      - name: Local service and TLS probes
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS --max-time 3 http://127.0.0.1:18080/health/live >/dev/null; then
            echo 'backend_18080=healthy'
          else
            echo 'backend_18080=unreachable'
          fi
          if timeout 4 openssl s_client -connect 127.0.0.1:443 -servername localhost </dev/null >/dev/null 2>&1; then
            echo 'local_tls_443=available'
          else
            echo 'local_tls_443=unavailable'
          fi
          if curl -fsS --max-time 3 http://127.0.0.1:80/ >/dev/null 2>&1; then
            echo 'local_http_80=available'
          else
            echo 'local_http_80=unavailable'
          fi
