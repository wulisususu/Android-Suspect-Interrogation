name: Task 12 RK3588 Read-only Inventory

on:
  push:
    branches:
      - feat/dual-speaker-backends
    paths:
      - '.github/workflows/task12-rk3588-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task12-rk3588-read-only-inventory
  cancel-in-progress: false

jobs:
  hosted-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify inventory is metadata-only and non-destructive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/task12-rk3588-inventory.yml').read_text(encoding='utf-8')
          forbidden = [
              'systemctl ' + 'restart',
              'systemctl ' + 'stop',
              'systemctl ' + 'start',
              'SUSPECT_' + 'SPEAKER_BACKEND=',
              'snapshot_' + 'download',
              'pip ' + 'install',
              ':80' + '00',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'forbidden board mutation token: {token}')
          if 'open(' in text or '.read_bytes(' in text or '.read_text(' in text[text.find('board-inventory'):]:
              raise SystemExit('board inventory must not open/read candidate audio content')
          print('TASK12_AUDIO_INVENTORY_HOSTED_CONTRACT_OK')
          PY

  board-inventory:
    needs: hosted-contract
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Read-only project audio metadata inventory
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/task12-audio-inventory"
          mkdir -p "$OUT"
          python3 - "$OUT/audio-metadata.json" <<'PY'
          import json
          import os
          import re
          import sys
          from collections import Counter, defaultdict
          from pathlib import Path

          output = Path(sys.argv[1])
          audio_exts = {'.wav', '.wave', '.pcm', '.raw'}
          role_tokens = {
              'SUSPECT': ('suspect', 'subject', 'detainee', 'xianyiren', '嫌疑', '被审'),
              'INTERROGATOR': ('interrogator', 'officer', 'police', 'examiner', 'shenxun', 'xunwen', '审讯', '讯问', '民警', '警员'),
              'RECORDER': ('recorder', 'clerk', 'scribe', 'recordkeeper', 'jiluyuan', '记录', '书记员'),
          }
          prune_names = {
              '.git', '.cache', '.local', 'node_modules', 'models', 'runtime', 'current',
              '_work', 'actions-runner', 'venv', '.venv', '__pycache__',
          }
          name_hint = re.compile(r'(suspect|interrogation|voiceprint|speaker|speech|audio|record)', re.I)

          roots = [
              Path('/var/lib/suspect-interrogation'),
              Path('/opt/suspect-interrogation/data'),
              Path('/srv/suspect-interrogation'),
              Path('/data/suspect-interrogation'),
          ]
          for base in (Path('/home/youyeetoo'), Path('/mnt'), Path('/srv'), Path('/data')):
              try:
                  children = list(base.iterdir()) if base.is_dir() else []
              except OSError:
                  children = []
              for child in children:
                  try:
                      if child.is_dir() and name_hint.search(child.name):
                          roots.append(child)
                  except OSError:
                      continue

          deduped = []
          seen = set()
          for root in roots:
              key = str(root)
              if key not in seen:
                  seen.add(key)
                  deduped.append(root)

          report = {
              'contract': 'metadata-only; candidate audio bytes were not opened or uploaded',
              'extensions': sorted(audio_exts),
              'roots': [],
              'same_corpus_candidate_roots': [],
          }

          for root in deduped:
              item = {
                  'root': str(root),
                  'exists': root.is_dir(),
                  'audio_count': 0,
                  'extension_counts': {},
                  'role_counts': {'SUSPECT': 0, 'INTERROGATOR': 0, 'RECORDER': 0, 'UNLABELED': 0},
                  'parent_directory_counts': [],
                  'metadata_bytes_total': 0,
              }
              if not item['exists']:
                  report['roots'].append(item)
                  continue

              extension_counts = Counter()
              role_counts = Counter()
              parent_counts = defaultdict(int)
              bytes_total = 0

              for dirpath, dirnames, filenames in os.walk(root, topdown=True, followlinks=False):
                  dirnames[:] = [d for d in dirnames if d not in prune_names]
                  for filename in filenames:
                      suffix = Path(filename).suffix.lower()
                      if suffix not in audio_exts:
                          continue
                      full = Path(dirpath) / filename
                      item['audio_count'] += 1
                      extension_counts[suffix] += 1
                      parent_counts[str(Path(dirpath))] += 1
                      try:
                          bytes_total += full.stat().st_size
                      except OSError:
                          pass

                      label_text = str(full).lower()
                      matched = None
                      for role, tokens in role_tokens.items():
                          if any(token.lower() in label_text for token in tokens):
                              matched = role
                              break
                      role_counts[matched or 'UNLABELED'] += 1

              item['extension_counts'] = dict(sorted(extension_counts.items()))
              item['role_counts'] = {key: role_counts.get(key, 0) for key in ('SUSPECT', 'INTERROGATOR', 'RECORDER', 'UNLABELED')}
              item['parent_directory_counts'] = [
                  {'directory': parent, 'count': count}
                  for parent, count in sorted(parent_counts.items())
              ]
              item['metadata_bytes_total'] = bytes_total
              if all(item['role_counts'].get(role, 0) >= 3 for role in ('SUSPECT', 'INTERROGATOR', 'RECORDER')):
                  report['same_corpus_candidate_roots'].append(str(root))
              report['roots'].append(item)

          output.write_text(json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2))
          print('TASK12_BROAD_AUDIO_METADATA_INVENTORY_COMPLETE')
          PY

      - name: Upload metadata-only inventory
        uses: actions/upload-artifact@v4
        with:
          name: task12-rk3588-audio-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/task12-audio-inventory/audio-metadata.json
          if-no-files-found: error
          retention-days: 7
