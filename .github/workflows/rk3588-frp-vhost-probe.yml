name: RK3588 FRP VHost Probe

on:
  push:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/rk3588-frp-vhost-probe.yml'
      - 'scripts/ci/rk3588-frp-vhost-probe.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rk3588-frp-vhost-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Temporary HTTP HTTPS vhost probe
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 10
    steps:
      - name: Fetch exact revision without git checkout
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/frp-vhost-probe-${GITHUB_RUN_ID}"
          rm -rf "$work"
          mkdir -p "$work"
          curl -fsSL --retry 8 --retry-all-errors --connect-timeout 15 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            -o "$work/source.tgz"
          mkdir -p "$work/src"
          tar -xzf "$work/source.tgz" -C "$work/src" --strip-components=1
          echo "PROBE_SOURCE=$work/src" >> "$GITHUB_ENV"

      - name: Probe vhost forwarding without persistent changes
        shell: bash
        env:
          PROBE_ID: ${{ github.run_id }}
        run: bash "$PROBE_SOURCE/scripts/ci/rk3588-frp-vhost-probe.sh"
