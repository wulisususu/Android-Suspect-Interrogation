name: RK3588 MOSS embedding Gate A

on:
  workflow_dispatch:
    inputs:
      build_root:
        description: Offline prestaged model, reference and SDK directory
        required: true
        default: /opt/moss-build
        type: string
      runtime_directory:
        description: Runtime library directory; override with a prestaged 1.3.0 SDK path for isolated probes
        required: true
        default: /lib
        type: string

permissions:
  contents: read

jobs:
  embed-probe:
    runs-on: [self-hosted, Linux, ARM64, rk3588]
    timeout-minutes: 30
    env:
      BUILD_ROOT: ${{ inputs.build_root }}
      RUNTIME_DIRECTORY: ${{ inputs.runtime_directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify offline assets and compile RKLLM_INPUT_EMBED probe
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_ROOT" = /* && "$RUNTIME_DIRECTORY" = /* ]]
          [[ "$BUILD_ROOT" != *$'\n'* && "$RUNTIME_DIRECTORY" != *$'\n'* ]]
          test -f /lib/librkllmrt.so
          test -f "$BUILD_ROOT/sdk-1.3.0/rkllm.h"
          test -f "$RUNTIME_DIRECTORY/librkllmrt.so"
          test -f "$BUILD_ROOT/moss_qwen3_0.6b_w8a8_rk3588.rkllm"
          test -f "$BUILD_ROOT/reference-zh-2spk-45s/input_embeds.f32"
          test -f "$BUILD_ROOT/reference-zh-2spk-45s/manifest.json"
          mkdir -p gate-a-evidence
          # Exact official release-v1.3.0 header/runtime; never replace shared libraries.
          printf '%s  %s\n' '80596a578f7f8e70df6eda1c2cbead3bfced14623a190258f2bd009a3d1f72cf' "$BUILD_ROOT/sdk-1.3.0/rkllm.h" '6a9e4fc5324c68921c3a900340361e107af7599fe34dc8fa7759b2c5ae22a6e6' "$RUNTIME_DIRECTORY/librkllmrt.so" | sha256sum -c -
          sha256sum "$BUILD_ROOT/sdk-1.3.0/rkllm.h" "$RUNTIME_DIRECTORY/librkllmrt.so" "$BUILD_ROOT/moss_qwen3_0.6b_w8a8_rk3588.rkllm" > gate-a-evidence/assets.sha256
          g++ -std=c++17 -O2 -Wall -Wextra tools/moss_rk3588/native/rkllm_embed_probe.cpp -I"$BUILD_ROOT/sdk-1.3.0" -L"$RUNTIME_DIRECTORY" -Wl,-rpath,"$RUNTIME_DIRECTORY" -lrkllmrt -o gate-a-evidence/rkllm_embed_probe
      - name: Run real embeddings and compare generated text
        shell: bash
        run: |
          set -euo pipefail
          tokens=$(python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path(os.environ['BUILD_ROOT']) / 'reference-zh-2spk-45s'
          m = json.loads((p / 'manifest.json').read_text())
          assert m['model_fingerprint'] == 'sha256:2617e17cfec24f24b17979b7ba6d607ce259f727224757e8e5f88b6894b74855'
          assert len(m['input_shape']) == 3 and m['input_shape'][0] == 1 and m['input_shape'][2] == 1024
          for name in ('input_embeds.f32', 'output.txt'):
              assert hashlib.sha256((p / name).read_bytes()).hexdigest() == m['artifacts'][name]
          print(m['input_shape'][1])
          PY
          )
          LD_LIBRARY_PATH="$RUNTIME_DIRECTORY" gate-a-evidence/rkllm_embed_probe --model "$BUILD_ROOT/moss_qwen3_0.6b_w8a8_rk3588.rkllm" --raw "$BUILD_ROOT/reference-zh-2spk-45s/input_embeds.f32" --tokens "$tokens" --max-new-tokens 2048 --output gate-a-evidence/output.txt 2>&1 | tee gate-a-evidence/native.log
          python3 tools/moss_rk3588/compare_pytorch_rkllm.py --reference "$BUILD_ROOT/reference-zh-2spk-45s/output.txt" --candidate gate-a-evidence/output.txt --output gate-a-evidence/comparison.json
      - name: Save Gate A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moss-embed-gate-a-${{ github.sha }}
          path: gate-a-evidence/
