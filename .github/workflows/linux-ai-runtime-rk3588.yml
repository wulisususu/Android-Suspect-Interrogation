name: Linux AI Runtime RK3588

on:
  push:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/linux-ai-runtime-rk3588.yml'
      - 'linux/backend/app/ai/**'
      - 'linux/backend/app/api/ai_runtime.py'
      - 'linux/backend/app/main.py'
      - 'linux/backend/config/model-registry.yaml'
      - 'linux/backend/models/**'
      - 'linux/backend/speech_worker/**'
      - 'linux/backend/tests/**'
      - 'linux/docs/AI_RUNTIME.md'
      - 'scripts/ci/probe-funasr-runtime.py'
      - 'scripts/ai-worker-start.sh'
      - 'systemd/ai-worker.service'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-runtime:
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 15
    env:
      AI_MODE: mock
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          hostname
          uname -a
          python3 --version

      - name: Robust sparse checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local http.version HTTP/1.1
          git config --local http.lowSpeedLimit 1024
          git config --local http.lowSpeedTime 15
          git sparse-checkout init --cone
          git sparse-checkout set .github linux docs scripts systemd tests

          fetched=0
          for attempt in 1 2 3 4 5; do
            echo "fetch attempt ${attempt}/5"
            if timeout 120s git -c protocol.version=2 fetch \
              --filter=blob:none \
              --no-tags \
              --prune \
              --no-recurse-submodules \
              --depth=1 \
              origin "+${GITHUB_SHA}:refs/remotes/origin/__ai_runtime_target"; then
              fetched=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$fetched" -eq 1
          git checkout --force --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify no model weights are committed
        shell: bash
        run: |
          set -euo pipefail
          if find linux/backend/models -type f \( -name '*.rkllm' -o -name '*.gguf' -o -name '*.onnx' -o -name '*.bin' -o -name '*.pt' -o -name '*.pth' \) | grep -q .; then
            echo 'Unexpected model weight found in repository.' >&2
            exit 1
          fi
          echo 'No model weights committed.'

      - name: Compile AI runtime
        shell: bash
        run: |
          set -euo pipefail
          cd linux/backend
          PYTHONPATH=. python3 -m compileall -q app/ai app/api/ai_runtime.py app/main.py tests
          python3 -m py_compile "$GITHUB_WORKSPACE/scripts/ci/probe-funasr-runtime.py"

      - name: Standard-library runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          cd linux/backend
          PYTHONPATH=. python3 tests/rk3588_ai_runtime_smoke.py

      - name: Full pytest suite when pytest is preinstalled
        shell: bash
        run: |
          set -euo pipefail
          cd linux/backend
          if python3 -c 'import pytest' >/dev/null 2>&1; then
            PYTHONPATH=. python3 -m pytest -q
          else
            echo 'pytest not preinstalled on runner; smoke suite already passed without downloads.'
          fi

      - name: Probe installed FunASR models without downloads
        shell: bash
        run: |
          set -euo pipefail
          MODEL_ROOT=/home/youyeetoo/funasr-models
          if [[ ! -d "$MODEL_ROOT" ]]; then
            echo "FunASR model root is not installed at ${MODEL_ROOT}; real-model probe skipped."
            exit 0
          fi

          FUNASR_PYTHON=''
          KNOWN_FUNASR_PYTHON=/home/youyeetoo/rkllm_model_zoo/funasr_env/bin/python
          if [[ -x "$KNOWN_FUNASR_PYTHON" ]] && "$KNOWN_FUNASR_PYTHON" -c 'import funasr, torch' >/dev/null 2>&1; then
            FUNASR_PYTHON="$KNOWN_FUNASR_PYTHON"
          elif python3 -c 'import funasr, torch' >/dev/null 2>&1; then
            FUNASR_PYTHON=python3
          fi

          if [[ -z "$FUNASR_PYTHON" ]]; then
            echo 'FunASR-capable Python interpreter not found; real-model probe skipped.'
            exit 0
          fi

          echo "funasr_python=${FUNASR_PYTHON}"
          MODEL_ROOT="$MODEL_ROOT" "$FUNASR_PYTHON" scripts/ci/probe-funasr-runtime.py \
            --output "$RUNNER_TEMP/funasr-probe.json"
          cat "$RUNNER_TEMP/funasr-probe.json"
