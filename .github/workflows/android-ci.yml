name: Android Final Regression CI

on:
  pull_request:
    paths:
      - 'android/**'
      - 'webapp/**'
      - '.github/workflows/android-ci.yml'
      - '.gitattributes'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'webapp/**'
      - '.github/workflows/android-ci.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git whitespace check
        run: git diff --check HEAD^

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Vue assets
        working-directory: webapp
        run: |
          npm install
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Android unit tests
        run: gradle -p android testDebugUnitTest --stacktrace --console=plain

      - name: Compile Android instrumentation tests
        run: gradle -p android assembleDebugAndroidTest --stacktrace --console=plain

      - name: Assemble debug APK
        run: gradle -p android assembleDebug --stacktrace --console=plain

      - name: Verify single ONNX Runtime native source
        run: gradle -p android verifyDebugOnnxRuntimeNative --stacktrace --console=plain

      - name: Verify APK web assets, external model boundary and native libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk_dir = Path('android/app/build/outputs/apk/debug')
          apks = sorted(apk_dir.glob('*.apk'))
          if not apks:
              raise SystemExit(f'No debug APK found under {apk_dir}')
          apk = apks[-1]

          required_assets = [
              'assets/webapp/index.html',
          ]
          required_native_libraries = [
              'lib/arm64-v8a/libonnxruntime.so',
              'lib/arm64-v8a/libonnxruntime4j_jni.so',
              'lib/arm64-v8a/libomp.so',
              'lib/arm64-v8a/librkllmrt.so',
              'lib/arm64-v8a/librkllm_jni.so',
              'lib/arm64-v8a/librknnrt.so',
              'lib/arm64-v8a/libsherpa-onnx-c-api.so',
              'lib/arm64-v8a/libsherpa-onnx-cxx-api.so',
              'lib/arm64-v8a/libsherpa-onnx-jni.so',
          ]

          with ZipFile(apk) as archive:
              entries = archive.namelist()
              names = set(entries)

              missing_assets = [entry for entry in required_assets if entry not in names]
              if missing_assets:
                  raise SystemExit('Required APK assets are missing: ' + ', '.join(missing_assets))

              forbidden_model_entries = sorted(
                  entry for entry in entries
                  if entry.startswith('assets/models/')
                  and (
                      entry.lower().endswith(('.onnx', '.rknn', '.rkllm', '.pdiparams', '.pdmodel'))
                      or entry.endswith('ppocr_keys_v1.txt')
                  )
              )
              if forbidden_model_entries:
                  raise SystemExit('Runtime model payloads must be external: ' + ', '.join(forbidden_model_entries))

              missing_libraries = [entry for entry in required_native_libraries if entry not in names]
              if missing_libraries:
                  raise SystemExit('Required arm64-v8a native libraries are missing: ' + ', '.join(missing_libraries))

              ort_count = entries.count('lib/arm64-v8a/libonnxruntime.so')
              if ort_count != 1:
                  raise SystemExit(f'Expected exactly one libonnxruntime.so in APK, found {ort_count}')
              ort_jni_count = entries.count('lib/arm64-v8a/libonnxruntime4j_jni.so')
              if ort_jni_count != 1:
                  raise SystemExit(f'Expected exactly one libonnxruntime4j_jni.so in APK, found {ort_jni_count}')

              arm64 = sorted(entry for entry in entries if entry.startswith('lib/arm64-v8a/') and entry.endswith('.so'))
              print(f'Verified APK: {apk}')
              print('Runtime model payloads: external only')
              print(f'arm64-v8a native libraries ({len(arm64)}):')
              for entry in arm64:
                  print('  ' + entry)
          PY

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-final-regression-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
