name: Case AI Instrumentation Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/case-ai-instrumentation-validation.yml'

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate committed diff
        run: git diff --check origin/main...HEAD

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare x86 test-only Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          text = text.replace('''        ndk {\n            abiFilters += "arm64-v8a"\n        }\n\n''', '')
          text = text.replace('''        externalNativeBuild {\n            cmake {\n                cppFlags += listOf("-std=c++17")\n            }\n        }\n\n''', '')
          text = text.replace('''    externalNativeBuild {\n        cmake {\n            path = file("src/main/cpp/CMakeLists.txt")\n            version = "3.22.1"\n        }\n    }\n''', '')
          text = text.replace(
              '        getByName("main").assets.srcDir(generatedWebAssets)\n',
              '        getByName("main").assets.srcDir(generatedWebAssets)\n        getByName("main").jniLibs.setSrcDirs(emptyList<String>())\n',
          )
          path.write_text(text)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Vue assets
        working-directory: webapp
        run: |
          npm install
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'emulator'

      - name: Build x86 instrumentation APK
        run: gradle -p android assembleDebugAndroidTest --stacktrace --console=plain

      - name: Run Case AI Room instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          working-directory: android
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle connectedDebugAndroidTest --stacktrace --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.wulisu.suspect.interrogation.data.AppDatabaseMigrationTest,com.wulisu.suspect.interrogation.data.CaseIsolationTest
