name: RK3588 Runner Connectivity Check

on:
  workflow_dispatch:
  push:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/runner-connectivity-check.yml'

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 10

    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          uname -a
          git --version
          python3 --version || true
          node --version || true

      - name: Robust partial checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local http.version HTTP/1.1
          git config --local http.lowSpeedLimit 1024
          git config --local http.lowSpeedTime 15
          git sparse-checkout init --cone
          git sparse-checkout set .github linux webapp backend-fastapi backend-dev docs

          fetched=0
          for attempt in 1 2 3 4 5; do
            echo "fetch attempt ${attempt}/5"
            if timeout 120s git -c protocol.version=2 fetch \
              --filter=blob:none \
              --no-tags \
              --prune \
              --no-recurse-submodules \
              --depth=1 \
              origin "+${GITHUB_SHA}:refs/remotes/origin/linux-adaptation"; then
              fetched=1
              break
            fi
            sleep $((attempt * 3))
          done

          if [ "$fetched" -ne 1 ]; then
            echo 'Git fetch failed after 5 bounded retries.' >&2
            exit 1
          fi

          git checkout --force --detach "$GITHUB_SHA"

      - name: Repository verification
        shell: bash
        run: |
          set -euo pipefail
          echo "github_repository=${GITHUB_REPOSITORY}"
          echo "github_ref=${GITHUB_REF}"
          echo "github_sha=${GITHUB_SHA}"
          git rev-parse --show-toplevel
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -d linux
          test -d webapp
          git status --short
