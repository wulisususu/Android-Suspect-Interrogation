name: RK3588 Runner Connectivity Check

on:
  workflow_dispatch:
  push:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/runner-connectivity-check.yml'

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 10

    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          echo "pwd=$(pwd)"
          uname -a
          git --version
          python3 --version || true
          node --version || true

      - name: GitHub network preflight
        shell: bash
        run: |
          set -euo pipefail
          getent hosts github.com || true
          getent hosts api.github.com || true
          curl -fsSIL --connect-timeout 5 --max-time 15 https://github.com/ >/dev/null
          curl -fsSIL --connect-timeout 5 --max-time 15 https://api.github.com/ >/dev/null
          timeout 20s git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" HEAD
          echo 'GitHub network preflight OK'

      - name: Checkout Linux migration workspace
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: false
          sparse-checkout: |
            .github
            linux
            webapp
            backend-fastapi
            backend-dev
            docs

      - name: Repository verification
        shell: bash
        run: |
          set -euo pipefail
          echo "github_repository=${GITHUB_REPOSITORY}"
          echo "github_ref=${GITHUB_REF}"
          echo "github_sha=${GITHUB_SHA}"
          git rev-parse --show-toplevel
          git rev-parse HEAD
          test -d linux
          test -d webapp
          git status --short
