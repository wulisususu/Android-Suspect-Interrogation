name: RK3588 Runner Connectivity Check

on:
  workflow_dispatch:
  push:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/runner-connectivity-check.yml'

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          echo "pwd=$(pwd)"

      - name: System information
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          git --version
          python3 --version || true
          node --version || true

      - name: Repository verification
        shell: bash
        run: |
          set -euo pipefail
          echo "github_repository=${GITHUB_REPOSITORY}"
          echo "github_ref=${GITHUB_REF}"
          echo "github_sha=${GITHUB_SHA}"
          git rev-parse --show-toplevel
          git rev-parse HEAD
          git status --short
