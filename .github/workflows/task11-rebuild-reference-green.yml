name: Task 11 Rebuild Reference GREEN

on:
  push:
    branches:
      - feat/dual-speaker-backends
    paths:
      - .superpowers/task11-rebuild-service-green.py
      - .superpowers/task11-rebuild-cli-docs-green.py
      - .github/workflows/task11-rebuild-reference-green.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task11-green:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: linux/backend
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: "1"
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-speaker-backends
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r linux/backend/requirements.txt pytest
      - name: Apply Task 11 production changes
        run: |
          python .superpowers/task11-rebuild-service-green.py
          python .superpowers/task11-rebuild-cli-docs-green.py
      - name: Compile Task 11 production code
        run: |
          python -m py_compile \
            linux/backend/app/services/speaker_reference_rebuild.py \
            linux/backend/app/services/voiceprint_service.py \
            scripts/ci/rebuild-speaker-reference.py
      - name: Task 11 rebuild contract
        run: python -m pytest -q tests/release/test_rebuild_speaker_reference.py
      - name: Existing voiceprint service and repository regression
        run: |
          python -m pytest -q \
            linux/backend/tests/test_voiceprint_service.py \
            linux/backend/tests/test_voiceprint_repositories.py
      - name: Full backend regression
        run: python -m pytest -q linux/backend/tests
      - name: Commit Task 11 production changes only after GREEN
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            linux/backend/app/services/voiceprint_service.py \
            linux/backend/app/services/speaker_reference_rebuild.py \
            scripts/ci/rebuild-speaker-reference.py \
            docs/security/AUDIT-EVENTS.md \
            docs/release/DEPLOYMENT.md
          git diff --cached --check
          git commit -m "feat: rebuild model-specific voiceprint references from audio"
          git push origin HEAD:feat/dual-speaker-backends
