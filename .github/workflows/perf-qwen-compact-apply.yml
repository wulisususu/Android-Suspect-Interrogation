name: Apply compact probe protocol

on:
  push:
    branches:
      - perf/qwen-routing-latency-experiment
    paths:
      - '.github/workflows/perf-qwen-compact-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/qwen-routing-latency-experiment
      - name: Apply exact compact-protocol patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/probe-llamapi-qwen-routing.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''    return payload\n\n\ndef _normalize_question_text(text: str | None) -> str:\n'''
          insert = '''    return payload\n\n\ndef _parse_compact_decision(raw: str) -> dict[str, Any]:\n    text = str(raw or "").strip()\n    if not (text.startswith("{") and text.endswith("}")):\n        raise ProbeError("compact model output must be JSON only")\n    try:\n        payload = json.loads(text)\n    except json.JSONDecodeError as exc:\n        raise ProbeError("compact model output is not valid JSON") from exc\n    if not isinstance(payload, dict):\n        raise ProbeError("compact model output must be an object")\n\n    code = payload.get("c")\n    if code not in {"A", "B", "C"}:\n        raise ProbeError(f"invalid compact classification: {code!r}")\n    answer = payload.get("a")\n    if not isinstance(answer, str) or not answer.strip():\n        raise ProbeError("compact formal answer is required")\n\n    if code in {"A", "B"}:\n        target = payload.get("t")\n        if not isinstance(target, str) or not target.strip():\n            raise ProbeError("compact existing route target is required")\n        target = target.strip()\n        return {\n            "classification": "MATCH_FIXED" if code == "A" else "MATCH_EXISTING",\n            "target_question_id": target,\n            "formal_question": None,\n            "formal_answer": answer.strip(),\n            "confidence": None,\n            "candidate_question_ids": [target],\n            "reason_code": f"COMPACT_{code}",\n        }\n\n    question = payload.get("q")\n    if not isinstance(question, str) or not question.strip():\n        raise ProbeError("compact new route question is required")\n    return {\n        "classification": "CREATE_LIVE_FROM_SPEECH",\n        "target_question_id": None,\n        "formal_question": question.strip(),\n        "formal_answer": answer.strip(),\n        "confidence": None,\n        "candidate_question_ids": [],\n        "reason_code": "COMPACT_C",\n    }\n\n\ndef _normalize_question_text(text: str | None) -> str:\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'parse insertion anchor count={text.count(anchor)}')
          text = text.replace(anchor, insert, 1)

          old_sig = '''def _complete(base_url: str, model_id: str, prompt: str, timeout: float) -> tuple[dict[str, Any], float, dict[str, Any]]:\n    request_payload = {\n'''
          new_sig = '''def _complete(\n    base_url: str,\n    model_id: str,\n    prompt: str,\n    timeout: float,\n    *,\n    protocol: str = "full",\n) -> tuple[dict[str, Any], float, dict[str, Any]]:\n    if protocol not in {"full", "compact"}:\n        raise ValueError("protocol must be full or compact")\n    request_payload = {\n'''
          if text.count(old_sig) != 1:
              raise SystemExit(f'complete signature anchor count={text.count(old_sig)}')
          text = text.replace(old_sig, new_sig, 1)

          old_budget = '''        "max_tokens": 192,\n        "enable_thinking": False,\n'''
          new_budget = '''        "max_tokens": 96 if protocol == "compact" else 192,\n        "enable_thinking": False,\n'''
          if text.count(old_budget) != 1:
              raise SystemExit(f'budget anchor count={text.count(old_budget)}')
          text = text.replace(old_budget, new_budget, 1)

          old_return = '''    return _parse_decision(content), elapsed_ms, telemetry\n'''
          new_return = '''    parser = _parse_compact_decision if protocol == "compact" else _parse_decision\n    return parser(content), elapsed_ms, telemetry\n'''
          if text.count(old_return) != 1:
              raise SystemExit(f'return anchor count={text.count(old_return)}')
          text = text.replace(old_return, new_return, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/ci/probe-llamapi-qwen-routing.py
          rm .github/workflows/perf-qwen-compact-apply.yml
      - name: Commit exact patch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ci/probe-llamapi-qwen-routing.py .github/workflows/perf-qwen-compact-apply.yml
          git commit -m 'feat: add compact qwen probe response protocol'
          git push origin HEAD:perf/qwen-routing-latency-experiment
