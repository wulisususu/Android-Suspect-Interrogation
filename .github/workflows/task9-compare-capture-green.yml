name: Task 9 Compare Capture GREEN

on:
  push:
    branches:
      - feat/dual-speaker-backends
    paths:
      - .superpowers/task9-compare-capture-green.py
      - .github/workflows/task9-compare-capture-green.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task9-green:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: linux/backend
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: "1"
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-speaker-backends
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r linux/backend/requirements.txt pytest httpx
      - name: Apply compare capture production changes
        run: python .superpowers/task9-compare-capture-green.py
      - name: Compile backend
        run: python -m compileall -q linux/backend
      - name: Compare capture and session targeted tests
        run: |
          python -m pytest -q \
            linux/backend/tests/test_speaker_compare_capture.py \
            linux/backend/tests/test_speaker_compare_session_wiring.py \
            linux/backend/tests/test_speaker_backend_compare.py \
            linux/backend/tests/test_speech_session.py \
            linux/backend/tests/test_speech_protocol.py \
            linux/backend/tests/test_asr_recognition_evidence.py
      - name: Full backend regression
        run: python -m pytest -q linux/backend/tests
      - name: Commit production changes only after GREEN
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            linux/backend/app/ai/speech/client.py \
            linux/backend/app/ai/supervisor.py \
            linux/backend/speech_worker/main.py \
            linux/backend/app/services/source_aware_asr_capture_service.py \
            linux/backend/app/main.py \
            linux/backend/app/services/asr_capture_service.py
          git diff --cached --check
          git commit -m "feat: add non-authoritative speaker compare mode"
          git push origin HEAD:feat/dual-speaker-backends
