name: Formal Template SFC Fix Gate

on:
  push:
    branches:
      - 'feat/dual-speaker-backends'
    paths:
      - '.superpowers/fix-formal-template-sfc.py'
      - '.github/workflows/formal-template-sfc-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formal-template-sfc-fix
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-speaker-backends
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install Vue dependencies
        working-directory: webapp
        run: npm ci
      - name: Apply deterministic SFC boundary fix
        run: python .superpowers/fix-formal-template-sfc.py
      - name: Structural regression test
        working-directory: webapp
        run: npx vitest run src/components/FormalTemplatePanel.sfc.test.ts
      - name: Full Vue tests
        working-directory: webapp
        run: npm test
      - name: Typecheck and production build
        working-directory: webapp
        run: |
          npm run typecheck
          npm run build
      - name: Vite dev-server module smoke
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/formal-template-vite.log"
          (cd webapp && npm run dev -- --host 127.0.0.1 --port 5173 >"$LOG" 2>&1) &
          VITE_PID=$!
          cleanup() { kill "$VITE_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:5173/src/components/FormalTemplatePanel.vue >/dev/null || {
            cat "$LOG" >&2
            exit 1
          }
          curl -fsS http://127.0.0.1:5173/src/App.vue >/dev/null || {
            cat "$LOG" >&2
            exit 1
          }
      - name: Commit component fix only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webapp/src/components/FormalTemplatePanel.vue
          if git diff --cached --quiet; then
            echo 'No component change to commit.'
            exit 0
          fi
          git commit -m 'fix: close formal template before scoped styles'
          git push origin HEAD:feat/dual-speaker-backends
