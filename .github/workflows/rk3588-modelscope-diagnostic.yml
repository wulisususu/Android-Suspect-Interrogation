name: RK3588 ModelScope XVector Diagnostic

on:
  push:
    branches:
      - feature/funasr-asr-capture
    paths:
      - '.github/workflows/rk3588-modelscope-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 30
    steps:
      - name: Runner hygiene and identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          hostname
          uname -a
          sudo -n find "$GITHUB_WORKSPACE" -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
      - name: Install legacy-compatible ModelScope
        shell: bash
        run: |
          set -euo pipefail
          PY=/opt/suspect-interrogation/runtime/funasr-env/bin/python
          sudo -n "$PY" -m pip install --retries 3 --timeout 60 --no-deps 'modelscope==1.11.0'
          "$PY" -c 'import modelscope; print("modelscope="+str(modelscope.__version__))'
      - name: Print ModelScope speaker pipeline traceback
        shell: bash
        run: |
          set -euo pipefail
          PY=/opt/suspect-interrogation/runtime/funasr-env/bin/python
          "$PY" - <<'PY'
          import traceback
          try:
              from modelscope.pipelines import pipeline
              from modelscope.utils.constant import Tasks
              print('MODELSCOPE_PIPELINE_IMPORT_OK', Tasks.speaker_verification)
          except Exception:
              print('MODELSCOPE_PIPELINE_IMPORT_FAILED')
              traceback.print_exc()
              raise
          PY
          "$PY" - <<'PY'
          import traceback
          from modelscope.pipelines import pipeline
          from modelscope.utils.constant import Tasks
          try:
              p = pipeline(task=Tasks.speaker_verification, model='/opt/suspect-interrogation/models/funasr/xvector', device='cpu')
              print('MODELSCOPE_XVECTOR_PIPELINE_LOAD_OK', type(p).__name__)
              out = p('/opt/suspect-interrogation/models/funasr/xvector/example/sv_example_enroll.wav')
              print('MODELSCOPE_XVECTOR_INFERENCE_OK', type(out).__name__, sorted(out.keys()) if isinstance(out, dict) else type(out).__name__)
              if isinstance(out, dict) and 'spk_embedding' in out:
                  emb = out['spk_embedding']
                  print('SPK_EMBEDDING_SHAPE', getattr(emb, 'shape', None))
          except Exception:
              print('MODELSCOPE_XVECTOR_PIPELINE_LOAD_OR_INFER_FAILED')
              traceback.print_exc()
              raise
          PY
