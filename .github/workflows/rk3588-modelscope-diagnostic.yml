name: RK3588 ModelScope XVector Diagnostic

on:
  push:
    branches:
      - feature/funasr-asr-capture
    paths:
      - '.github/workflows/rk3588-modelscope-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 30
    steps:
      - name: Runner hygiene and identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          hostname
          uname -a
          sudo -n find "$GITHUB_WORKSPACE" -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
      - name: Build isolated legacy package overlay
        shell: bash
        run: |
          set -euo pipefail
          PY=/opt/suspect-interrogation/runtime/funasr-env/bin/python
          LEGACY="$RUNNER_TEMP/xvector-legacy-overlay"
          rm -rf "$LEGACY"
          mkdir -p "$LEGACY"
          "$PY" -m pip install --retries 3 --timeout 60 --no-deps --target "$LEGACY" \
            'funasr==0.5.7' 'modelscope==1.6.1'
          PYTHONPATH="$LEGACY" "$PY" - <<'PY'
          import funasr, modelscope
          print('legacy_funasr=', getattr(funasr, '__version__', 'unknown'))
          print('legacy_modelscope=', getattr(modelscope, '__version__', 'unknown'))
          from funasr.bin import sv_inference_launch
          print('SV_INFERENCE_LAUNCH_IMPORT_OK', sv_inference_launch.__file__)
          PY
      - name: Run legacy XVector locally without network
        shell: bash
        run: |
          set -euo pipefail
          PY=/opt/suspect-interrogation/runtime/funasr-env/bin/python
          LEGACY="$RUNNER_TEMP/xvector-legacy-overlay"
          MODEL=/opt/suspect-interrogation/models/funasr/xvector
          WAV="$MODEL/example/sv_example_enroll.wav"
          test -f "$WAV"
          PYTHONPATH="$LEGACY" HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 MODELSCOPE_OFFLINE=1 \
            "$PY" - <<'PY'
          import socket
          original_connect = socket.socket.connect
          def blocked(self, address):
              raise RuntimeError(f'network disabled during legacy XVector inference: {address}')
          socket.socket.connect = blocked
          try:
              from modelscope.pipelines import pipeline
              from modelscope.utils.constant import Tasks
              p = pipeline(task=Tasks.speaker_verification,
                           model='/opt/suspect-interrogation/models/funasr/xvector',
                           device='cpu', ngpu=0)
              out = p('/opt/suspect-interrogation/models/funasr/xvector/example/sv_example_enroll.wav')
          finally:
              socket.socket.connect = original_connect
          print('LEGACY_XVECTOR_OUTPUT_KEYS', sorted(out.keys()))
          emb = out.get('spk_embedding')
          assert emb is not None, out
          print('LEGACY_XVECTOR_EMBEDDING_SHAPE', getattr(emb, 'shape', None))
          print('LEGACY_XVECTOR_OFFLINE_OK')
          PY
