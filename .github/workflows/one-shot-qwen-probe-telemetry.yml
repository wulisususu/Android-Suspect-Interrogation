name: One-shot Qwen probe telemetry edit

on:
  push:
    branches:
      - feat/qwen-formal-record-routing
    paths:
      - .github/workflows/one-shot-qwen-probe-telemetry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen-formal-record-routing
          fetch-depth: 0
      - name: Apply exact probe telemetry replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/probe-llamapi-qwen-routing.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'def _complete(base_url: str, model_id: str, prompt: str, timeout: float) -> tuple[dict[str, Any], float]:',
                  'def _complete(base_url: str, model_id: str, prompt: str, timeout: float) -> tuple[dict[str, Any], float, dict[str, Any]]:',
              ),
              (
                  '    return _parse_decision(message["content"]), elapsed_ms',
                  '''    content = message["content"]\n    usage_raw = response.get("usage")\n    usage: dict[str, int] | None = None\n    if isinstance(usage_raw, dict):\n        clean_usage: dict[str, int] = {}\n        for key in ("prompt_tokens", "completion_tokens", "total_tokens"):\n            value = usage_raw.get(key)\n            if isinstance(value, int) and not isinstance(value, bool) and value >= 0:\n                clean_usage[key] = value\n        if clean_usage:\n            usage = clean_usage\n    telemetry = {\n        "prompt_chars": len(prompt),\n        "response_chars": len(content),\n        "usage": usage,\n    }\n    return _parse_decision(content), elapsed_ms, telemetry''',
              ),
              (
                  '                    "raw_decision": None,\n                }',
                  '                    "raw_decision": None,\n                    "telemetry": None,\n                }',
              ),
              (
                  '                        raw_decision, latency_ms = _complete(base_url, model_id, _prompt(case), args.timeout)',
                  '                        prompt = _prompt(case)\n                        raw_decision, latency_ms, telemetry = _complete(base_url, model_id, prompt, args.timeout)',
              ),
              (
                  '                        row["raw_decision"] = raw_decision\n                        decision = _canonicalize_existing_target_decision',
                  '                        row["raw_decision"] = raw_decision\n                        row["telemetry"] = telemetry\n                        decision = _canonicalize_existing_target_decision',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/ci/probe-llamapi-qwen-routing.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ci/probe-llamapi-qwen-routing.py
          git rm .github/workflows/one-shot-qwen-probe-telemetry.yml
          git commit -m 'feat: record qwen routing inference telemetry'
          git push origin HEAD:feat/qwen-formal-record-routing
