name: RK3588 Qwen Formal Routing Acceptance

# Final acceptance: 20 effective A-E decisions, telemetry, and reliable memory evidence.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/qwen-formal-record-routing
      - linux-adaptation
    paths:
      - '.github/workflows/rk3588-qwen-formal-routing-acceptance.yml'
      - 'scripts/ci/probe-llamapi-qwen-routing.py'
      - 'scripts/ci/sample-process-memory.py'
      - 'linux/backend/app/ai/**'
      - 'linux/backend/app/services/formal_record_router.py'
      - 'linux/backend/app/services/formal_record_routing_service.py'
      - 'linux/backend/app/services/qa_routing_coordinator.py'
      - 'linux/backend/tests/test_probe_llamapi_qwen_routing.py'
      - 'linux/backend/tests/test_qwen_acceptance_runtime_metrics.py'
      - 'linux/backend/tests/test_llamapi_llm_engine.py'
      - 'linux/backend/tests/test_qwen_formal_routing_e2e.py'

permissions:
  contents: read

concurrency:
  group: rk3588-qwen-formal-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-gate:
    name: Hosted Qwen routing gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: linux/backend
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: '1'
      AI_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r linux/backend/requirements.txt pytest httpx

      - name: Focused semantic-routing verification
        run: |
          python -m compileall -q linux/backend scripts/ci/probe-llamapi-qwen-routing.py scripts/ci/sample-process-memory.py
          python -m pytest \
            linux/backend/tests/test_probe_llamapi_qwen_routing.py \
            linux/backend/tests/test_probe_qwen_route_canonicalization.py \
            linux/backend/tests/test_qwen_acceptance_runtime_metrics.py \
            linux/backend/tests/test_llamapi_llm_engine.py \
            linux/backend/tests/test_qwen_formal_routing_e2e.py -q

      - name: Stage verified board probe
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/qwen-probe-bundle"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE"
          cp scripts/ci/probe-llamapi-qwen-routing.py "$BUNDLE/"
          cp scripts/ci/sample-process-memory.py "$BUNDLE/"
          printf '%s\n' "$GITHUB_SHA" > "$BUNDLE/source-sha.txt"
          (
            cd "$BUNDLE"
            sha256sum probe-llamapi-qwen-routing.py sample-process-memory.py > bundle.sha256
          )

      - name: Upload verified board probe
        uses: actions/upload-artifact@v4
        with:
          name: qwen-routing-probe-bundle
          path: ${{ runner.temp }}/qwen-probe-bundle/
          if-no-files-found: error
          retention-days: 3

  rk3588-probe:
    name: RK3588 read-only LlamaPi probe
    needs: hosted-gate
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 25
    env:
      LLAMAPI_BASE_URL: 'http://127.0.0.1:9265/v1'
      LLAMAPI_MODEL_HINT: 'qwen3:4b'
    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          hostname
          uname -a
          test "$(uname -m)" = aarch64 -o "$(uname -m)" = arm64

      - name: Download hosted-verified probe
        uses: actions/download-artifact@v4
        with:
          name: qwen-routing-probe-bundle
          path: ${{ runner.temp }}/qwen-probe-bundle

      - name: Verify probe integrity and source revision
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qwen-probe-bundle"
          test "$(cat source-sha.txt)" = "$GITHUB_SHA"
          sha256sum -c bundle.sha256
          python3 -m py_compile probe-llamapi-qwen-routing.py sample-process-memory.py

      - name: Verify LlamaPi preconditions without mutation
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active llamapi-server.service | tee "$RUNNER_TEMP/llamapi-service-state.txt"
          curl -fsS "$LLAMAPI_BASE_URL/models" | tee "$RUNNER_TEMP/llamapi-models.json"
          echo '--- unrelated TCP/8000 observation only ---' | tee "$RUNNER_TEMP/port-8000.txt"
          ss -ltnp 'sport = :8000' 2>&1 | tee -a "$RUNNER_TEMP/port-8000.txt" || true

      - name: Run 20-decision final semantic routing probe
        shell: bash
        run: |
          set -euo pipefail
          PID="$(systemctl show -p MainPID --value llamapi-server.service)"
          CGROUP="$(systemctl show -p ControlGroup --value llamapi-server.service)"
          test -n "$PID"
          test "$PID" != '0'
          test -r "/proc/$PID/status"
          MEMORY_PATH="$RUNNER_TEMP/llamapi-memory.jsonl"
          CGROUP_CURRENT="/sys/fs/cgroup${CGROUP}/memory.current"
          : > "$MEMORY_PATH"
          python3 "$RUNNER_TEMP/qwen-probe-bundle/sample-process-memory.py" \
            --pid "$PID" \
            --cgroup-current "$CGROUP_CURRENT" \
            --interval 1 \
            --output "$MEMORY_PATH" &
          MONITOR_PID=$!
          cleanup_monitor() {
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
          }
          trap cleanup_monitor EXIT
          python3 "$RUNNER_TEMP/qwen-probe-bundle/probe-llamapi-qwen-routing.py" \
            --base-url "$LLAMAPI_BASE_URL" \
            --model-hint "$LLAMAPI_MODEL_HINT" \
            --repetitions 4 \
            --timeout 120 \
            --output "$RUNNER_TEMP/qwen-routing-probe.json"
          cleanup_monitor
          trap - EXIT
          PROBE_PATH="$RUNNER_TEMP/qwen-routing-probe.json" MEMORY_PATH="$MEMORY_PATH" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          probe = json.loads(Path(os.environ['PROBE_PATH']).read_text(encoding='utf-8'))
          if probe.get('effective_decision_count') != 20:
              raise SystemExit(f"expected 20 effective decisions, got {probe.get('effective_decision_count')}")
          if probe.get('model_inference_count') != 12:
              raise SystemExit(f"expected 12 model inferences, got {probe.get('model_inference_count')}")

          memory_rows = []
          for raw in Path(os.environ['MEMORY_PATH']).read_text(encoding='utf-8').splitlines():
              try:
                  row = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if isinstance(row, dict):
                  memory_rows.append(row)
          process_values = [
              int(row['process_rss_kb'])
              for row in memory_rows
              if isinstance(row.get('process_rss_kb'), int) and row['process_rss_kb'] > 0
          ]
          cgroup_values = [
              int(row['cgroup_memory_kb'])
              for row in memory_rows
              if isinstance(row.get('cgroup_memory_kb'), int) and row['cgroup_memory_kb'] > 0
          ]
          if not process_values:
              raise SystemExit('no valid process VmRSS samples were captured')

          telemetry_rows = [
              row.get('telemetry')
              for row in probe.get('samples', [])
              if isinstance(row, dict) and isinstance(row.get('telemetry'), dict)
          ]
          prompt_chars = [int(row['prompt_chars']) for row in telemetry_rows if isinstance(row.get('prompt_chars'), int)]
          response_chars = [int(row['response_chars']) for row in telemetry_rows if isinstance(row.get('response_chars'), int)]
          usage_rows = [row.get('usage') for row in telemetry_rows if isinstance(row.get('usage'), dict)]

          runtime = {
              'effective_decision_count': probe.get('effective_decision_count'),
              'model_inference_count': probe.get('model_inference_count'),
              'latency_ms': probe.get('latency_ms'),
              'memory_sample_count': len(memory_rows),
              'process_rss_sample_count': len(process_values),
              'cgroup_memory_sample_count': len(cgroup_values),
              'llamapi_peak_process_rss_kb': max(process_values),
              'llamapi_peak_process_rss_mb': round(max(process_values) / 1024.0, 2),
              'llamapi_peak_cgroup_memory_kb': max(cgroup_values) if cgroup_values else None,
              'llamapi_peak_cgroup_memory_mb': round(max(cgroup_values) / 1024.0, 2) if cgroup_values else None,
              'telemetry': {
                  'model_sample_count': len(telemetry_rows),
                  'prompt_chars_min': min(prompt_chars) if prompt_chars else None,
                  'prompt_chars_max': max(prompt_chars) if prompt_chars else None,
                  'response_chars_min': min(response_chars) if response_chars else None,
                  'response_chars_max': max(response_chars) if response_chars else None,
                  'usage_sample_count': len(usage_rows),
                  'usage': usage_rows,
              },
              'gate': 'semantic-final-20',
          }
          Path(os.environ['RUNNER_TEMP'], 'qwen-routing-runtime.json').write_text(
              json.dumps(runtime, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(runtime, ensure_ascii=False, indent=2))
          PY

      - name: Final read-only diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo '--- LlamaPi service ---'
          systemctl --no-pager --full status llamapi-server.service || true
          echo '--- LlamaPi models ---'
          cat "$RUNNER_TEMP/llamapi-models.json" 2>/dev/null || true
          echo '--- Qwen routing probe ---'
          cat "$RUNNER_TEMP/qwen-routing-probe.json" 2>/dev/null || true
          echo '--- runtime metrics ---'
          cat "$RUNNER_TEMP/qwen-routing-runtime.json" 2>/dev/null || true
          echo '--- unrelated TCP/8000 observation ---'
          cat "$RUNNER_TEMP/port-8000.txt" 2>/dev/null || true

      - name: Upload RK3588 Qwen acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-qwen-formal-routing-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/llamapi-service-state.txt
            ${{ runner.temp }}/llamapi-models.json
            ${{ runner.temp }}/qwen-routing-probe.json
            ${{ runner.temp }}/qwen-routing-runtime.json
            ${{ runner.temp }}/llamapi-memory.jsonl
            ${{ runner.temp }}/port-8000.txt
          if-no-files-found: warn
          retention-days: 30
