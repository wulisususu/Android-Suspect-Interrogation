name: RK3588 Feature Deploy

on:
  push:
    branches:
      - feature/funasr-asr-capture
    paths:
      - '.github/workflows/rk3588-feature-deploy.yml'

permissions:
  contents: read

concurrency:
  group: rk3588-feature-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy feature speech stack to RK3588
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 60
    env:
      GIT_TERMINAL_PROMPT: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SUSPECT_DEPLOY_PORT: '18080'
      FUNASR_PACKAGE_VERSION: '1.4.2'
      TORCH_CPU_VERSION: '2.13.0'
      MODELSCOPE_PACKAGE_VERSION: '1.39.1'
      CALIBRATION_ROOT: '/var/lib/suspect-interrogation/calibration'

    steps:
      - name: RK3588 preflight and exact checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          hostname
          uname -a
          test "$(uname -m)" = aarch64 -o "$(uname -m)" = arm64
          sudo -n true
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local http.version HTTP/1.1
          git sparse-checkout init --cone
          git sparse-checkout set .github linux webapp deploy scripts systemd tests docs
          fetched=0
          for attempt in 1 2 3 4 5; do
            if timeout 120s git -c protocol.version=2 fetch --filter=blob:none --no-tags --depth=1 \
              origin "+${GITHUB_SHA}:refs/remotes/origin/__feature_deploy"; then
              fetched=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$fetched" -eq 1
          git checkout --force --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/ci/probe-funasr-runtime.py scripts/ci/rk3588-speech-calibrate.py scripts/ci/rk3588-speech-smoke.py

      - name: Preserve existing project API and TCP 8000 during speech preflight
        shell: bash
        run: |
          set -euo pipefail
          echo '--- preserved TCP/8000 owner before deploy ---'
          sudo -n ss -ltnp 'sport = :8000' || true

          if ! systemctl is-active --quiet interrogation-api.service && [[ -L /opt/suspect-interrogation/current ]]; then
            echo 'Project API is inactive after an earlier failed deploy; attempting to restore the current release before speech preflight.'
            sudo -n systemctl start interrogation-api.service || true
            sleep 2
          fi

          if sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" | grep -q ":${SUSPECT_DEPLOY_PORT}"; then
            if systemctl is-active --quiet interrogation-api.service; then
              echo 'existing project API on TCP/18080 is preserved during speech preflight'
              sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" || true
            else
              echo "TCP/${SUSPECT_DEPLOY_PORT} is occupied by a non-project process; refusing destructive takeover" >&2
              sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" || true
              exit 1
            fi
          else
            echo "TCP/${SUSPECT_DEPLOY_PORT} is free; speech preflight can proceed without stopping the existing release."
          fi

      - name: Prepare read-only FunASR models and isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          FUNASR_SOURCE=/home/youyeetoo/funasr-models
          FUNASR_MODEL_ROOT=/opt/suspect-interrogation/models/funasr
          FUNASR_RUNTIME=/opt/suspect-interrogation/runtime/funasr-env
          test -d "$FUNASR_SOURCE/paraformer"
          test -d "$FUNASR_SOURCE/fsmn-vad"
          test -d "$FUNASR_SOURCE/xvector"
          sudo -n install -d -o root -g root -m 0755 /opt/suspect-interrogation/models /opt/suspect-interrogation/runtime
          if ! mountpoint -q "$FUNASR_MODEL_ROOT"; then
            sudo -n install -d -o root -g root -m 0755 "$FUNASR_MODEL_ROOT"
            sudo -n mount --bind "$FUNASR_SOURCE" "$FUNASR_MODEL_ROOT"
          fi
          sudo -n mount -o remount,bind,ro "$FUNASR_MODEL_ROOT"
          case ",$(findmnt -no OPTIONS "$FUNASR_MODEL_ROOT")," in
            *,ro,*) ;;
            *) echo 'FunASR model mount is not read-only' >&2; exit 1 ;;
          esac
          FSTAB_LINE="$FUNASR_SOURCE $FUNASR_MODEL_ROOT none bind,ro,nofail,x-systemd.before=ai-worker.service 0 0"
          if ! sudo -n awk -v dst="$FUNASR_MODEL_ROOT" '$2 == dst {found=1} END {exit(found?0:1)}' /etc/fstab; then
            printf '%s\n' "$FSTAB_LINE" | sudo -n tee -a /etc/fstab >/dev/null
          fi

          runtime_ok=0
          if [[ -x "$FUNASR_RUNTIME/bin/python" ]] && \
             sudo -n "$FUNASR_RUNTIME/bin/python" -c 'import funasr, torch, modelscope; assert "+cpu" in str(torch.__version__); assert modelscope.__version__ == "1.39.1"' >/dev/null 2>&1; then
            runtime_ok=1
          fi
          if [[ "$runtime_ok" -ne 1 ]]; then
            echo "Provisioning CPU-only isolated FunASR runtime under $FUNASR_RUNTIME"
            sudo -n rm -rf "$FUNASR_RUNTIME"
            sudo -n python3 -m venv "$FUNASR_RUNTIME"
            sudo -n "$FUNASR_RUNTIME/bin/python" -m pip install --upgrade pip
            sudo -n "$FUNASR_RUNTIME/bin/python" -m pip install --retries 3 --timeout 60 \
              --index-url https://download.pytorch.org/whl/cpu \
              "torch==${TORCH_CPU_VERSION}+cpu"
            sudo -n "$FUNASR_RUNTIME/bin/python" -m pip install --retries 3 --timeout 60 \
              "funasr==${FUNASR_PACKAGE_VERSION}"
            sudo -n "$FUNASR_RUNTIME/bin/python" -m pip install --retries 3 --timeout 60 \
              "modelscope==${MODELSCOPE_PACKAGE_VERSION}"
            sudo -n chown -R root:root "$FUNASR_RUNTIME"
            sudo -n chmod -R go-w "$FUNASR_RUNTIME"
          fi
          sudo -n "$FUNASR_RUNTIME/bin/python" -c 'import funasr,torch,modelscope; assert "+cpu" in str(torch.__version__); assert modelscope.__version__ == "1.39.1"; print("funasr="+str(funasr.__version__)); print("torch="+str(torch.__version__)); print("modelscope="+str(modelscope.__version__))'
          MODEL_ROOT="$FUNASR_MODEL_ROOT" sudo -n -E "$FUNASR_RUNTIME/bin/python" scripts/ci/probe-funasr-runtime.py --output "$RUNNER_TEMP/funasr-probe.json"
          cat "$RUNNER_TEMP/funasr-probe.json"
          echo 'TCP/8000 remains untouched after speech runtime preflight:'
          sudo -n ss -ltnp 'sport = :8000' || true

      - name: Install release and configure real AI
        shell: bash
        run: |
          set -euo pipefail
          sudo -n bash deploy/control.sh install
          RUNTIME_ENV=/etc/suspect-interrogation/runtime.env
          upsert() {
            local key="$1" value="$2"
            if sudo -n grep -q "^${key}=" "$RUNTIME_ENV"; then
              sudo -n sed -i -E "s|^${key}=.*|${key}=${value}|" "$RUNTIME_ENV"
            else
              printf '%s=%s\n' "$key" "$value" | sudo -n tee -a "$RUNTIME_ENV" >/dev/null
            fi
          }
          upsert SUSPECT_API_PORT "$SUSPECT_DEPLOY_PORT"
          upsert AI_MODE real
          AI_ENV=/etc/suspect-interrogation/ai-worker.env
          if [[ ! -f "$AI_ENV" ]]; then
            sudo -n install -o root -g suspect-interrogation -m 0640 /dev/null "$AI_ENV"
          fi
          sudo -n chown root:suspect-interrogation "$AI_ENV"
          sudo -n chmod 0640 "$AI_ENV"
          sudo -n systemctl daemon-reload
          sudo -n env SUSPECT_HEALTH_BASE_URL="http://127.0.0.1:${SUSPECT_DEPLOY_PORT}" bash deploy/control.sh deploy "$GITHUB_WORKSPACE"

      - name: Start real speech worker and verify socket models
        shell: bash
        run: |
          set -euo pipefail
          sudo -n systemctl enable --now ai-worker.service
          for _ in $(seq 1 90); do
            if systemctl is-active --quiet ai-worker.service && [[ -S /run/suspect-interrogation/speech.sock ]]; then break; fi
            sleep 1
          done
          systemctl is-active --quiet ai-worker.service
          test -S /run/suspect-interrogation/speech.sock
          PYTHONPATH=/opt/suspect-interrogation/current/linux/backend \
            /opt/suspect-interrogation/runtime/funasr-env/bin/python - <<'PY'
          from app.ai.speech.client import SpeechWorkerClient
          h=SpeechWorkerClient('/run/suspect-interrogation/speech.sock',timeout=30).health()
          m=h.get('models') or {}
          assert m.get('asr') is True, h
          assert m.get('vad') is True, h
          assert m.get('speaker') is True, h
          print(h)
          PY

      - name: Apply local calibration only when protected samples exist
        shell: bash
        run: |
          set -euo pipefail
          AI_ENV=/etc/suspect-interrogation/ai-worker.env
          mapfile -d '' S < <(find "$CALIBRATION_ROOT/suspect" -maxdepth 1 -type f -name '*.wav' -print0 2>/dev/null | sort -z || true)
          mapfile -d '' I < <(find "$CALIBRATION_ROOT/interrogator" -maxdepth 1 -type f -name '*.wav' -print0 2>/dev/null | sort -z || true)
          mapfile -d '' R < <(find "$CALIBRATION_ROOT/recorder" -maxdepth 1 -type f -name '*.wav' -print0 2>/dev/null | sort -z || true)
          THRESHOLD="$(sudo -n awk -F= '$1=="SUSPECT_SPEAKER_ACCEPT_THRESHOLD"{print $2}' "$AI_ENV" | tail -n1)"
          MARGIN="$(sudo -n awk -F= '$1=="SUSPECT_SPEAKER_MARGIN"{print $2}' "$AI_ENV" | tail -n1)"
          if [[ ( -z "$THRESHOLD" || -z "$MARGIN" ) && "${#S[@]}" -ge 3 && "${#I[@]}" -ge 3 && "${#R[@]}" -ge 3 ]]; then
            sudo -n env PYTHONPATH=/opt/suspect-interrogation/current/linux/backend \
              /opt/suspect-interrogation/runtime/funasr-env/bin/python \
              /opt/suspect-interrogation/current/scripts/ci/rk3588-speech-calibrate.py \
              --socket /run/suspect-interrogation/speech.sock \
              --suspect-wavs "${S[@]}" --interrogator-wavs "${I[@]}" --recorder-wavs "${R[@]}" \
              --env-file "$AI_ENV" --output "$RUNNER_TEMP/calibration.json" --apply >/dev/null
            cat "$RUNNER_TEMP/calibration.json"
            THRESHOLD="$(sudo -n awk -F= '$1=="SUSPECT_SPEAKER_ACCEPT_THRESHOLD"{print $2}' "$AI_ENV" | tail -n1)"
            MARGIN="$(sudo -n awk -F= '$1=="SUSPECT_SPEAKER_MARGIN"{print $2}' "$AI_ENV" | tail -n1)"
            sudo -n systemctl restart interrogation-api.service
          fi
          if [[ -n "$THRESHOLD" && -n "$MARGIN" ]]; then
            echo "speaker_calibration=configured threshold=$THRESHOLD margin=$MARGIN"
          else
            echo 'speaker_calibration=NOT_CONFIGURED'
            echo 'formal ASR capture stays fail-closed until protected real samples are calibrated'
          fi
          if [[ -n "$THRESHOLD" && -n "$MARGIN" && "${#S[@]}" -ge 1 && "${#I[@]}" -ge 1 && "${#R[@]}" -ge 1 ]]; then
            PYTHONPATH=/opt/suspect-interrogation/current/linux/backend \
              /opt/suspect-interrogation/runtime/funasr-env/bin/python \
              /opt/suspect-interrogation/current/scripts/ci/rk3588-speech-smoke.py \
              --socket /run/suspect-interrogation/speech.sock --model-root /opt/suspect-interrogation/models/funasr \
              --api-base "http://127.0.0.1:${SUSPECT_DEPLOY_PORT}" --threshold "$THRESHOLD" --margin "$MARGIN" \
              --suspect-wav "${S[0]}" --interrogator-wav "${I[0]}" --recorder-wav "${R[0]}"
          else
            echo 'real_speech_policy_smoke=pending_local_calibration_samples'
          fi

      - name: Verify deployed API frontend worker and preserved port
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet interrogation-api.service
          systemctl is-active --quiet ai-worker.service
          test -S /run/suspect-interrogation/speech.sock
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${SUSPECT_DEPLOY_PORT}/health/ready" >/tmp/ready.json && break
            sleep 1
          done
          cat /tmp/ready.json
          curl -fsS "http://127.0.0.1:${SUSPECT_DEPLOY_PORT}/" | grep -q '<div id="app"></div>'
          echo '--- TCP/18080 ---'
          sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" || true
          echo '--- preserved TCP/8000 ---'
          sudo -n ss -ltnp 'sport = :8000' || true

      - name: Final diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo '--- release ---'; readlink -f /opt/suspect-interrogation/current || true
          echo '--- runtime env ---'; sudo -n grep -E '^(SUSPECT_API_PORT|AI_MODE)=' /etc/suspect-interrogation/runtime.env || true
          echo '--- calibration ---'; sudo -n grep -E '^SUSPECT_SPEAKER_(ACCEPT_THRESHOLD|MARGIN)=' /etc/suspect-interrogation/ai-worker.env || true
          echo '--- services ---'; sudo -n systemctl --no-pager --full status interrogation-api.service ai-worker.service || true
          echo '--- socket ---'; ls -l /run/suspect-interrogation/speech.sock 2>/dev/null || true
          echo '--- ports ---'; sudo -n ss -ltnp 'sport = :18080' || true; sudo -n ss -ltnp 'sport = :8000' || true
          echo '--- ai-worker journal ---'; sudo -n journalctl -u ai-worker.service -n 160 --no-pager || true
          echo '--- api journal ---'; sudo -n journalctl -u interrogation-api.service -n 100 --no-pager || true
