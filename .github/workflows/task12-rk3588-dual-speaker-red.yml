name: Task 12 RK3588 Dual Speaker RED

on:
  push:
    branches:
      - feat/dual-speaker-backends
    paths:
      - tests/release/test_rk3588_dual_speaker_probes.py
      - .github/workflows/task12-rk3588-dual-speaker-red.yml
  workflow_dispatch:

jobs:
  task12-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Task 12 release contracts
        run: python -m pytest -q tests/release/test_rk3588_dual_speaker_probes.py
