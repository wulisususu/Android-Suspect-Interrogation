name: Task 10 Speaker Backend GREEN

on:
  push:
    branches:
      - feat/dual-speaker-backends
    paths:
      - .superpowers/task10-speaker-backend-green.py
      - .github/workflows/task10-speaker-backend-green.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task10-backend-green:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: linux/backend
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: "1"
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-speaker-backends
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r linux/backend/requirements.txt pytest httpx
      - name: Apply Task 10 backend production changes
        run: python .superpowers/task10-speaker-backend-green.py
      - name: Compile backend
        run: python -m compileall -q linux/backend
      - name: Task 10 backend targeted tests
        run: |
          python -m pytest -q \
            linux/backend/tests/test_speaker_runtime_api.py \
            linux/backend/tests/test_speaker_runtime_reconfigure.py \
            linux/backend/tests/test_speaker_calibration_api.py \
            linux/backend/tests/test_voiceprint_api.py \
            linux/backend/tests/test_speaker_compare_capture.py \
            linux/backend/tests/test_speaker_compare_session_wiring.py
      - name: Full backend regression
        run: python -m pytest -q linux/backend/tests
      - name: Commit backend production changes only after GREEN
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            linux/backend/app/api/speaker_runtime.py \
            linux/backend/app/api/speaker_calibration.py \
            linux/backend/app/services/source_aware_asr_capture_service.py \
            linux/backend/app/services/voiceprint_service.py \
            linux/backend/app/api/voiceprints.py \
            linux/backend/app/main.py
          git diff --cached --check
          git commit -m "feat: expose speaker runtime selection api"
          git push origin HEAD:feat/dual-speaker-backends
