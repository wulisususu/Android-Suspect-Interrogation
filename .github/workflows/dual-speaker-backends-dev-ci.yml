name: Dual Speaker Backends Dev CI

on:
  push:
    branches:
      - 'feat/dual-speaker-backends'
    paths:
      - '.github/workflows/dual-speaker-backends-dev-ci.yml'
      - '.github/workflows/linux-ai-runtime-rk3588.yml'
      - 'linux/backend/**'
      - 'scripts/**'
      - 'tests/release/**'
      - 'webapp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-speaker-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: linux/backend
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: '1'
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r linux/backend/requirements.txt pytest httpx
      - name: Dual speaker backend tests
        run: |
          python -m pytest \
            linux/backend/tests/test_speaker_backend_registry.py \
            linux/backend/tests/test_funasr_runtime_adapter.py \
            linux/backend/tests/test_xvector_backend.py \
            linux/backend/tests/test_eres2net_large_backend.py \
            linux/backend/tests/test_speech_session.py \
            linux/backend/tests/test_dual_speaker_voiceprint_persistence.py \
            linux/backend/tests/test_dual_speaker_voiceprint_migration.py \
            tests/release/test_funasr_probe_script.py \
            -q