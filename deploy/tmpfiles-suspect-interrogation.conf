# systemd-tmpfiles fragment for the MOSS RK3588 worker (Task 14).
# Install to /etc/tmpfiles.d/suspect-interrogation-moss.conf and run:
#   systemd-tmpfiles --create /etc/tmpfiles.d/suspect-interrogation-moss.conf
# RuntimeDirectory=suspect-interrogation in moss-worker.service already
# creates this directory for the unit; this fragment only guarantees it also
# exists at boot (and after manual cleanups) before the worker binds
# /run/suspect-interrogation/moss.sock. The socket file itself is chmod 0660
# by moss_worker.main.MossWorkerServer.bind().
d /run/suspect-interrogation 0750 suspect-interrogation suspect-interrogation -
